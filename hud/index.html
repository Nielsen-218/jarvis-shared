<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jarvis</title>
<link rel="stylesheet" href="../app/design-system.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg-0); color: var(--text-1); overflow: hidden; user-select: none; height: 100%;
    font: 400 13px/1.45 var(--font-ui); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(90% 55% at 50% 18%, rgba(92,198,230,.08), transparent 62%); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select { font: inherit; color: var(--text-1); background: var(--bg-3); border: 1px solid var(--line-2);
    border-radius: var(--r-2); padding: 8px 10px; outline: none; }
  input:focus, select:focus { border-color: var(--accent); }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; }

  /* title bar */
  #bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px 0 14px; cursor: move; position: relative; z-index: 3; }
  #bar .t { flex: 1; min-width: 0; }
  #bar b { font-size: 12px; letter-spacing: .34em; color: var(--accent); font-weight: 700; }
  #bar .st { font-size: 12px; letter-spacing: .08em; color: var(--text-2); text-transform: uppercase; margin-left: 8px; }
  .badges { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: 1px; }
  .badge { font-size: 12px; letter-spacing: .1em; padding: 1px 6px; border-radius: var(--r-pill); border: 1px solid var(--line-2);
    color: var(--accent); text-transform: uppercase; display: none; }
  .badge.on { display: inline-block; } .badge.rec { color: #ff6b6b; border-color: rgba(255,107,107,.5); }
  .wbtn { width: 24px; height: 24px; border-radius: 7px; color: var(--text-2); display: grid; place-items: center; }
  .wbtn:hover { background: var(--accent-soft); color: var(--text-1); }
  .wbtn svg { width: 14px; height: 14px; }

  /* stage: Jarvis himself */
  #stage { position: relative; height: 214px; flex: none; cursor: pointer; }
  #face { position: absolute; inset: 0; width: 100%; height: 100%; }
  #bubble { position: absolute; left: 14px; right: 14px; bottom: 4px; padding: 9px 13px; border-radius: var(--r-3);
    background: rgba(9, 20, 33, .92); border: 1px solid var(--line-2); box-shadow: 0 6px 22px rgba(0,0,0,.45);
    font-size: 13px; line-height: 1.4; opacity: 0; transform: translateY(6px); transition: .25s; pointer-events: none; }
  #bubble.on { opacity: 1; transform: none; }
  #bubble::before { content: ""; position: absolute; top: -7px; left: 50%; width: 12px; height: 12px; transform: translateX(-50%) rotate(45deg);
    background: rgba(9, 20, 33, .92); border-left: 1px solid var(--line-2); border-top: 1px solid var(--line-2); }

  /* dock */
  #dock { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 8px 10px; flex: none; }
  #dock button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; border-radius: var(--r-2);
    background: var(--bg-1); border: 1px solid var(--line-2); color: var(--text-2); font-size: 12px; font-weight: 600; transition: .15s; }
  #dock button svg { width: 19px; height: 19px; }
  #dock button:hover { color: var(--text-1); border-color: var(--line-2); }
  #dock button.on { color: var(--bg-0); background: linear-gradient(135deg, var(--accent), var(--accent)); border-color: transparent; }

  /* panels */
  #view { flex: 1; min-height: 0; margin: 0 10px 10px; border-radius: var(--r-3); background: var(--bg-1); border: 1px solid var(--line-2);
    overflow: hidden; display: flex; flex-direction: column; }
  .pane { display: none; flex: 1; min-height: 0; flex-direction: column; animation: in .22s ease-out; }
  .pane.on { display: flex; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; scrollbar-width: thin; scrollbar-color: #1d3247 transparent; }
  @keyframes in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  h3 { font-size: 12px; letter-spacing: .08em; color: var(--text-2); text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
  .muted { color: var(--text-2); }
  .btn { padding: 9px 14px; border-radius: 11px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent));
    color: var(--accent-ink); box-shadow: 0 6px 18px var(--accent-soft); }
  .btn { white-space: nowrap; } .btn:disabled { opacity: .45; box-shadow: none; cursor: default; }
  .btn.ghost { background: var(--bg-2); color: var(--text-1); border: 1px solid var(--line-2); box-shadow: none; }
  .btn.green { background: linear-gradient(135deg, #5ee08a, #2fd1a5); color: #03140a; box-shadow: 0 6px 18px rgba(94,224,138,.25); }
  .row { display: flex; gap: 8px; align-items: center; }

  /* chat */
  #log { display: flex; flex-direction: column; justify-content: flex-end; gap: 7px; min-height: 100%; }
  .line { word-wrap: break-word; animation: in .25s ease-out; }
  .line b { font-weight: 700; letter-spacing: .08em; font-size: 12px; margin-right: 6px; }
  .line.you b { color: var(--warn); } .line.jarvis b { color: var(--accent); }
  .line.sys { color: var(--text-2); font-style: italic; font-size: 12px; }
  #ask { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line-2); }
  #ask input { flex: 1; }
  #media { display: none; padding: 8px 8px 0; }
  #media.show { display: block; }
  #media img { width: 100%; max-height: 190px; object-fit: contain; border-radius: var(--r-2); cursor: zoom-in; background: #050a10; }
  #media .cap { display: flex; justify-content: space-between; color: var(--text-2); font-size: 12px; margin-top: 4px; }
  #media .cap a { color: var(--accent); cursor: pointer; }

  /* workout */
  .wo-title { font-size: 16px; font-weight: 700; line-height: 1.25; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin: 7px 0 10px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: var(--r-pill); background: var(--bg-2); border: 1px solid var(--line-2); color: var(--text-2); }
  .chip.c { color: var(--accent); }
  .ex { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line-1); align-items: baseline; }
  .ex .n { width: 18px; color: var(--text-2); font-size: 12px; text-align: right; flex: none; }
  .ex .nm { flex: 1; } .ex .d { color: var(--accent); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ex.done .nm { color: var(--text-2); text-decoration: line-through; } .ex.cur .nm { color: var(--text-1); font-weight: 700; }
  .session { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 14px 12px; flex: 1; }
  .session .ph { font-size: 12px; letter-spacing: .08em; color: var(--warn); font-weight: 700; text-transform: uppercase; }
  .session .big { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .session .sub { color: var(--accent); font-weight: 600; }
  .session .note { color: var(--text-2); font-size: 12px; max-width: 330px; }
  .ring { position: relative; width: 132px; height: 132px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ring .num small { display: block; font-size: 12px; letter-spacing: .08em; color: var(--text-2); font-weight: 700; margin-top: -4px; }
  .setin { display: flex; gap: 8px; align-items: center; justify-content: center; }
  .setin input { width: 78px; text-align: center; }
  .prog { height: 4px; background: var(--line-1); border-radius: 4px; overflow: hidden; width: 100%; flex: none; }
  .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent)); transition: width .4s; }

  /* games */
  .games { display: grid; gap: 8px; }
  .game { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: var(--r-3); background: var(--bg-2); border: 1px solid var(--line-2); text-align: left; }
  .game:hover { border-color: var(--line-2); }
  .game .ic { color: var(--accent); width: 40px; height: 40px; border-radius: var(--r-2); display: grid; place-items: center; flex: none; font-size: 20px;
    background: var(--accent-soft); }
  .game b { display: block; font-size: 14px; } .game small { color: var(--text-2); }
  .game .best { margin-left: auto; font-size: 12px; color: var(--warn); white-space: nowrap; }
  .q { font-size: 15px; font-weight: 600; line-height: 1.35; margin: 4px 0 12px; }
  .opts { display: grid; gap: 7px; }
  .opt { padding: 10px 12px; border-radius: 11px; background: var(--bg-2); border: 1px solid var(--line-2); text-align: left; font-size: 13.5px; }
  .opt:hover:not([disabled]) { border-color: var(--accent); }
  .opt.right { border-color: var(--ok); background: var(--ok-soft); } .opt.wrong { border-color: var(--danger); background: var(--danger-soft); }
  .score { display: flex; justify-content: space-between; color: var(--text-2); font-size: 12px; margin-bottom: 4px; }
  .score b { color: var(--text-1); }
  .rps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .rps button { padding: 16px 0; border-radius: var(--r-3); background: var(--bg-2); border: 1px solid var(--line-2); font-size: 30px; }
  .rps button:hover { border-color: var(--accent); transform: translateY(-2px); }
  .vs { display: flex; justify-content: space-around; align-items: center; font-size: 40px; min-height: 64px; }
  .vs span { font-size: 12px; color: var(--text-2); }
  /* tic-tac-toe + memory boards */
  .ttt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px auto; max-width: 240px; }
  .ttt button { aspect-ratio: 1; border-radius: var(--r-2); background: var(--bg-2); border: 1px solid var(--line-2); font-size: 34px; font-weight: 700; display: grid; place-items: center; }
  .ttt button:not(:disabled):hover { border-color: var(--accent); }
  .ttt button.x { color: var(--warn); } .ttt button.o { color: var(--accent); }
  .ttt button.win { background: linear-gradient(135deg, var(--accent), var(--accent)); color: var(--accent-ink); border-color: transparent; }
  .mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px auto; max-width: 260px; }
  .mem button { aspect-ratio: 1; border-radius: var(--r-2); background: var(--bg-1); border: 1px solid var(--line-2); font-size: 24px; display: grid; place-items: center; transition: transform .15s, background .15s; }
  .mem button.up { background: var(--bg-2); transform: rotateY(0deg); } .mem button.down { color: transparent; }
  .mem button.done { background: linear-gradient(135deg, #1f3a2a, #14301f); border-color: var(--ok); }
  /* catch */
  .arena { position: relative; height: 260px; border-radius: var(--r-3); background: radial-gradient(60% 60% at 50% 40%, #0c1a2a, #070f18); border: 1px solid var(--line-2); overflow: hidden; margin: 10px 0; }
  .catch-t { position: absolute; width: 54px; height: 54px; border-radius: 50%; border: 0; cursor: pointer; font-size: 26px; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #7ef0ff, #1b8fd6); box-shadow: 0 0 18px rgba(56,240,255,.5); transition: transform .08s; }
  .catch-t:active { transform: scale(.85); }
  /* simon / dance */
  .pads { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px auto; max-width: 240px; }
  .pads button { aspect-ratio: 1.3; border-radius: var(--r-3); border: 1px solid var(--line-2); font-size: 30px; background: var(--bg-2); transition: background .12s, transform .12s, box-shadow .12s; }
  .pads button.lit { transform: scale(1.04); }
  .pads button[data-d="up"].lit { background: #2f6be0; box-shadow: 0 0 20px #2f6be0; }
  .pads button[data-d="down"].lit { background: #e04f7a; box-shadow: 0 0 20px #e04f7a; }
  .pads button[data-d="left"].lit { background: #5ee08a; box-shadow: 0 0 20px #5ee08a; color: #042; }
  .pads button[data-d="right"].lit { background: #ffb300; box-shadow: 0 0 20px #ffb300; color: #320; }
  /* basketball */
  .court { position: relative; height: 220px; border-radius: var(--r-3); background: linear-gradient(#0c1a2a, #0a1420); border: 1px solid var(--line-2); overflow: hidden; margin: 10px 0; }
  .hoop { position: absolute; top: 24px; width: 54px; height: 10px; border: 3px solid #ff8a3d; border-top: 0; border-radius: 0 0 10px 10px; }
  .ball { position: absolute; bottom: 10px; left: 50%; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffb36b, #e2662a); }
  .power { height: 14px; border-radius: 8px; background: #0a1420; border: 1px solid var(--line-2); overflow: hidden; margin: 8px 0; position: relative; }
  .power i { position: absolute; top: 0; bottom: 0; width: 4px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .power .zone { position: absolute; top: 0; bottom: 0; background: rgba(94,224,138,.25); border-left: 1px solid #5ee08a; border-right: 1px solid #5ee08a; }
  /* soccer goal */
  .goal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 12px auto; max-width: 260px; aspect-ratio: 3/2;
    padding: 8px; border: 3px solid #cfe3f6; border-radius: 6px; background: repeating-linear-gradient(90deg, #0b1626, #0b1626 12px, #0d1a2c 12px, #0d1a2c 24px); }
  .goal button { border-radius: 8px; border: 1px dashed rgba(207,227,246,.25); background: rgba(255,255,255,.03); font-size: 24px; display: grid; place-items: center; }
  .goal button:hover { background: var(--accent-soft); border-color: var(--accent); }
  /* treasure grid */
  .dig { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 12px auto; max-width: 270px; }
  .dig button { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg-2); font-size: 18px; }
  .dig button.hot { background: #5a1f1f; } .dig button.warm { background: #5a4420; } .dig button.cold { background: #1f3a5a; }
  .dig button.found { background: linear-gradient(135deg, var(--warn), #ffe08a); color: #320; }
  /* bowling pins */
  .lane { text-align: center; font-size: 26px; letter-spacing: 4px; margin: 10px 0; min-height: 34px; }
  /* doors / lanes */
  .doors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px auto; max-width: 280px; }
  .doors button, .lanes button { aspect-ratio: 1; border-radius: var(--r-2); border: 1px solid var(--line-2); background: var(--bg-2); font-size: 30px; }
  .doors button:not(:disabled):hover, .lanes button:not(:disabled):hover { border-color: var(--accent); }
  .lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px auto; max-width: 280px; }
  .lanes button.warn { box-shadow: 0 0 20px #ffb300; border-color: #ffb300; }
  .beatpad.lit { background: #38f0ff; box-shadow: 0 0 22px #38f0ff; color: #042; transform: scale(1.05); }
  .bigtimer { height: 6px; background: var(--accent); border-radius: 3px; transition: width linear; }
  .pad { flex: 1; margin: 6px 0; border-radius: var(--r-3); display: grid; place-items: center; font-size: 18px; font-weight: 700; cursor: pointer;
    background: var(--bg-2); border: 1px solid var(--line-2); min-height: 170px; text-align: center; padding: 10px; }
  .pad.wait { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  .pad.go { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .back { color: var(--text-2); font-size: 12px; margin-bottom: 8px; display: inline-block; }
  .back:hover { color: var(--text-1); }

  /* timers + focus strip */
  #chips { display: none; gap: 6px; padding: 0 10px 2px; flex-wrap: wrap; flex: none; }
  #chips.on { display: flex; }
  .tchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 4px 3px 10px; border-radius: var(--r-pill);
    background: var(--warn-soft); border: 1px solid var(--warn); color: #ffd98a; }
  .tchip b { font-variant-numeric: tabular-nums; color: #fff; }
  .tchip button { width: 18px; height: 18px; border-radius: 50%; color: #ffd98a; line-height: 1; }
  .tchip button:hover { background: rgba(255,179,0,.25); }
  .tchip.focus { background: var(--accent-soft); border-color: var(--accent); color: #cdbdff; padding-right: 10px; }
  .tchip.brk { background: var(--ok-soft); border-color: var(--ok); color: #a9f0c4; padding-right: 10px; }
  /* focus pane */
  .presets { display: grid; gap: 8px; }
  .preset { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r-3); background: var(--bg-2); border: 1px solid var(--line-2); text-align: left; }
  .preset:hover { border-color: rgba(157,123,255,.55); }
  .preset .big2 { font-size: 20px; font-weight: 700; color: #cdbdff; width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  .preset b { display: block; font-size: 14px; } .preset small { color: var(--text-2); }
  /* nudge card */
  #nudge { display: none; margin: 10px 10px 0; padding: 11px 12px; border-radius: var(--r-3); background: var(--ok-soft);
    border: 1px solid var(--ok); animation: in .25s ease-out; }
  #nudge.on { display: block; }
  #nudge b { color: #a9f0c4; font-size: 12px; letter-spacing: .08em; } #nudge p { margin: 4px 0 9px; font-size: 13px; }
  /* check-in + achievements */
  .checkin { padding: 11px 12px; border-radius: var(--r-3); background: var(--line-1); border: 1px solid var(--line-2); margin-bottom: 12px; }
  .checkin .q2 { display: flex; align-items: center; gap: 6px; margin-top: 7px; font-size: 12px; color: var(--text-2); }
  .checkin .q2 span { width: 62px; flex: none; }
  .seg { display: flex; gap: 4px; flex: 1; }
  .seg button { flex: 1; padding: 5px 0; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line-2); font-size: 12px; font-weight: 600; }
  .seg button.on { background: linear-gradient(135deg, var(--accent), var(--accent)); color: var(--bg-0); border-color: transparent; }
  .streak { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--text-2); margin-bottom: 8px; flex-wrap: wrap; }
  .streak b { color: var(--warn); }
  .badges2 { display: flex; gap: 4px; flex-wrap: wrap; }
  .badges2 span { font-size: 15px; filter: grayscale(1) opacity(.35); } .badges2 span.on { filter: none; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; width: 100%; height: 100%; }

  /* mini mode: just Jarvis */
  body.mini #dock, body.mini #view, body.mini #bar .t .st, body.mini .badges, body.mini #chips { display: none; }
  body.mini #stage { height: 262px; }
  body.mini #bubble { left: 6px; right: 6px; font-size: 12px; }
  body.mini #bar b { letter-spacing: .08em; }
</style>
</head>
<body>
<div id="app">
  <div id="bar" class="pywebview-drag-region">
    <div class="t"><b>J.A.R.V.I.S.</b><span class="st" id="state">Starting up</span>
      <span class="badges"><span class="badge" id="b-who"></span><span class="badge rec" id="b-eyes">Eyes</span>
        <span class="badge" id="b-interp">Interp</span><span class="badge" id="b-lang">EN</span>
        <span class="badge rec" id="b-muted">Mic off</span><span class="badge" id="b-dict">Dictating</span><span class="badge" id="b-focus"></span></span></div>
    <button class="wbtn" id="voiceBtn" title="Jarvis's voice for the companion (quips, workout cues)"></button>
    <button class="wbtn" id="miniBtn" title="Shrink to just Jarvis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg></button>
    <button class="wbtn" title="Hide (say 'show the HUD' to bring it back)" onclick="window.pywebview && pywebview.api.hide()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  </div>

  <div id="stage" title="Poke Jarvis"><canvas id="face"></canvas><div id="bubble"></div></div>

  <div id="chips"></div>
  <div id="dock">
    <button data-v="chat" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Talk</button>
    <button data-v="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Workout</button>
    <button data-v="focus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Focus</button>

function startSession(t) {

        + ` First up: ${nameOf(it)}, ${setsOf(it)} sets of ${String(it.reps).replace(/-/g, " to ")}.`, "happy");
}
let restTick = null;
function renderSession() {
  clearInterval(restTick);
  const box = $("#wo"), it = W.items[W.i], total = W.items.reduce((a, x) => a + setsOf(x), 0);
  const doneSets = Object.keys(W.log).length;

        <defs><linearGradient id="gr"><stop offset="0" stop-color="#4fc3f7"/><stop offset="1" stop-color="#9d7bff"/></linearGradient></defs></svg>
        <div class="num"><div><span id="cd">0</span><small>SECONDS</small></div></div></div>

      <div class="row"><button class="btn ghost" id="plus">+30 s</button><button class="btn" id="skip">I'm ready</button></div></div>`;
    let said10 = false;
    const tick = () => {
      const left = Math.max(0, Math.round((W.restEnd - Date.now()) / 1000));
      const cd = $("#cd"); if (!cd) return clearInterval(restTick);
      cd.textContent = left; $("#arc").setAttribute("stroke-dashoffset", String(326.7 * (1 - left / dur)));
      if (left === 10 && !said10) { said10 = true; speak(pick(LAST10), "neutral"); }
      if (left <= 3 && left > 0) beep(660, 90);
      if (left <= 0) { clearInterval(restTick); beep(990, 220); W.restEnd = 0; store.set("wo", W); renderSession();
        speak(`Go. ${nameOf(it)}, set ${W.set + 1}.`, "happy"); }
    };

    $("#skip").onclick = () => { W.restEnd = 0; store.set("wo", W); renderSession(); };
    return;
  }
  const ex = FIT && FIT.exercises && FIT.exercises[it.exercise] || {};
  box.innerHTML = `<div class="prog"><i style="width:${100 * doneSets / total}%"></i></div><div class="session">
    <div class="ph">Exercise ${W.i + 1} of ${W.items.length} · set ${W.set + 1} of ${setsOf(it)}</div>
    <div class="big">${esc(nameOf(it))}</div>

    <div class="setin"><input id="wt" inputmode="decimal" placeholder="lb" value="${esc(prev.w || "")}" aria-label="Weight">
      <input id="rp" inputmode="numeric" placeholder="reps" value="${esc(prev.r || (parseInt(it.reps) || ""))}" aria-label="Reps"></div>
    <div class="row"><button class="btn ghost" id="skipEx">Skip exercise</button><button class="btn green" id="setDone">Set done</button></div>
    <div class="row" style="margin-top:2px"><button class="back" id="quit">End session</button></div></div>`;

}
function finishSession(early) {

    return { exercise: nameOf(it), sets: rows.length, reps: rs.length ? Math.round(rs.reduce((a, b) => a + b, 0) / rs.length) : (parseInt(it.reps) || 0),

/* ---- Tic-tac-toe (you're X; a strong but beatable AI) ---- */
const TTT_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function tttWinner(bd) {
  for (const [a, b, c] of TTT_LINES) if (bd[a] && bd[a] === bd[b] && bd[a] === bd[c]) return { who: bd[a], line: [a, b, c] };
  return bd.every(v => v) ? { who: "draw", line: null } : null;
}
function tttMinimax(bd, player) {   // O maximizes, X minimizes; returns {score, move}
  const w = tttWinner(bd);
  if (w) return { score: w.who === "O" ? 1 : w.who === "X" ? -1 : 0, move: -1 };
  let best = { score: player === "O" ? -2 : 2, move: -1 };
  for (let i = 0; i < 9; i++) if (!bd[i]) {
    bd[i] = player; const s = tttMinimax(bd, player === "O" ? "X" : "O").score; bd[i] = "";
    if (player === "O" ? s > best.score : s < best.score) { best = { score: s, move: i }; if (s === (player === "O" ? 1 : -1)) break; }
  }
  return best;
}

    $("#st").innerHTML = `<div class="prog"><i style="width:${100 * i / STRETCHES.length}%"></i></div><div class="session"><div class="ph" style="color:var(--ok)">Stretch ${i + 1} of ${STRETCHES.length}</div>
      <div class="big">${name}</div><div class="note">${how}</div><div class="ring" style="width:110px;height:110px"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" stroke="rgba(94,224,138,.15)" stroke-width="8" fill="none"/>
      <circle id="sarc" cx="60" cy="60" r="52" stroke="#5ee08a" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="326.7"/></svg><div class="num"><span id="scd">${secs}</span></div></div>
      <div class="row"><button class="btn ghost" id="snext">Next</button><button class="back" id="squit">Stop</button></div></div>`;
    $("#snext").onclick = () => { i++; step(); }; $("#squit").onclick = () => { clearInterval(stretchT); show(beforeStretch); };
    speak(`${name}. ${how}`, "happy");
  };
  stretchT = setInterval(() => {
    const left = Math.max(0, (end - Date.now()) / 1000), el = $("#scd"); if (!el) return;
    el.textContent = Math.ceil(left); $("#sarc").setAttribute("stroke-dashoffset", String(326.7 * (1 - left / 20)));
    if (left <= 0) { beep(880, 110); i++; step(); }
  }, 250);
  step();
}
function hideNudge() { $("#nudge").classList.remove("on"); }
function nudge(mins) {
  act.lastNudge = Date.now(); act.nudges = (act.nudges || 0) + 1; store.set("act", act);
  const water = act.nudges % 2 === 0;
  const line = pick([`You've been at it for ${mins} minutes, sir. Two minutes of stretching? Your back has filed a complaint.`,
    `${mins} minutes straight. Impressive focus. Now stand up before you fossilise.`,
    `Quick break? ${mins} minutes at the desk. A short stretch now buys you another good hour.`]) + (water ? " And some water wouldn't hurt." : "");
  $("#nudge").innerHTML = `<b>BREAK TIME</b><p>${esc(line)}</p><div class="row"><button class="btn green" id="ngo">Stretch with me · 2 min</button>
    <button class="btn ghost" id="nlater">In 15 min</button><button class="back" id="nno">Dismiss</button></div>`;
  $("#nudge").classList.add("on");
  $("#ngo").onclick = stretch;
  $("#nlater").onclick = () => { hideNudge(); act.lastNudge = Date.now() - 30 * 60000; store.set("act", act); bubble("Fifteen minutes. I'll hold you to it.", 2500); };
  $("#nno").onclick = () => { hideNudge(); act.streakStart = Date.now(); };
  speak(line, "smug");
}
async function welcomeBack(awayMs) {
  const mins = Math.round(awayMs / 60000), since = (Date.now() - awayMs) / 1000, bits = [];
  const [d, a] = await Promise.all([call("GET", "/api/dashboard"), call("GET", "/api/awareness")]);
  if (mins >= 90) bits.push(`You were gone ${mins >= 120 ? Math.round(mins / 60) + " hours" : "an hour and a half"}.`);
  if (a.ok) { const n = (a.data.entries || []).filter(e => e.t >= since && e.who !== "Jarvis").length;
    if (n) bits.push(`${n} thing${n > 1 ? "s were" : " was"} said while you were out — ask me what.`); }
  if (d.ok) {
    const hm = new Date().toTimeString().slice(0, 5), next = (d.data.today || []).find(x => String(x).slice(0, 5) > hm);
    if (next) bits.push(`Next up at ${String(next).slice(0, 5)}: ${String(next).slice(6)}.`);
    const p = (d.data.problems || []).length; if (p) bits.push(`Heads-up: ${p} thing${p > 1 ? "s need" : " needs"} attention on the dashboard.`);
  }
  if (TIMERS.length) bits.push(`Your ${TIMERS[0].label} timer has ${Math.ceil((TIMERS[0].ends - Date.now() / 1000) / 60)} minutes left.`);
  const hello = pick(["Welcome back, sir.", "Ah, you're back.", "There you are, sir."]);
  speak(bits.length ? `${hello} ${bits.join(" ")}` : `${hello} ${pick(["Nothing caught fire.", "All quiet on the home front.", "I kept everything running. Naturally."])}`, "happy");
}
async function watch() {
  const a = API(); if (!a || !a.idle_seconds) return;
  let idle; try { idle = await a.idle_seconds(); } catch (e) { return; }
  const now = Date.now(), h = new Date().getHours();
  if (idle >= 30 * 60) { if (!act.awayStart) act.awayStart = now - idle * 1000; hideNudge(); }
  else if (act.awayStart && idle < 60) {
    const away = now - act.awayStart; act.awayStart = null; act.streakStart = now;
    if (!quiet() && h >= 6 && now - (act.lastWelcome || 0) > 20 * 60000) { act.lastWelcome = now; store.set("act", act); welcomeBack(away); }
    morningPrompt();
  }
  if (idle >= 5 * 60) act.streakStart = null; else if (!act.streakStart) act.streakStart = now - idle * 1000;
  const mins = act.streakStart ? Math.round((now - act.streakStart) / 60000) : 0;
  const inWorkout = W && W.date === today() && !W.finished;
  if (mins >= 50 && now - (act.lastNudge || 0) > 45 * 60000 && !quiet() && !inWorkout && view !== "stretch" && h >= 7 && h < 23) nudge(mins);
}
function morningPrompt() {
  const h = new Date().getHours(), d = today();
  if (h < 5 || h >= 12 || act.prompted === d || quiet() || !FIT || FIT.checkin) return;
  act.prompted = d; store.set("act", act);
  setMood("happy", 3000); bubble("Morning, sir. Ten-second check-in? It's at the top of Workout — it tunes today's session.", 7000);
}
let ck = {};
function checkinCard() {
  const h = new Date().getHours();
  if (!FIT || FIT.checkin || h >= 15) return "";
  const seg = (k, vals, labels) => `<div class="seg" data-k="${k}">${vals.map((v, i) => `<button data-v="${v}">${labels ? labels[i] : v}</button>`).join("")}</div>`;
  return `<div class="checkin" id="ck"><b style="font-size:12.5px">Morning check-in</b><span class="muted" style="font-size:12px"> · tunes today's session</span>
    <div class="q2"><span>Sleep</span>${seg("sleep_hours", [5, 6, 7, 8, 9, 10], ["≤5", "6", "7", "8", "9", "10+"])}</div>
    <div class="q2"><span>Energy</span>${seg("energy", [1, 2, 3, 4, 5])}</div>
    <div class="q2"><span>Soreness</span>${seg("soreness", [1, 2, 3, 4, 5])}</div>
    <div class="row" style="margin-top:9px"><button class="btn" id="ckgo" style="padding:7px 12px" disabled>Save check-in</button><span class="muted" style="font-size:12px">1 = low · 5 = high</span></div></div>`;
}
function bindCheckin() {
  if (!$("#ck")) return; ck = {};
  document.querySelectorAll("#ck .seg button").forEach(b => b.onclick = () => {
    const k = b.parentElement.dataset.k; ck[k] = +b.dataset.v;
    b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    $("#ckgo").disabled = !(ck.sleep_hours && ck.energy && ck.soreness);
  });
  $("#ckgo").onclick = async () => {
    $("#ckgo").disabled = true;
    const r = await call("POST", "/api/fitness/checkin", ck);
    if (r.ok) { FIT = r.data.data; speak(r.data.message || "Checked in.", ck.energy >= 4 ? "happy" : "neutral"); renderWorkout(); }
    else { bubble("Couldn't save the check-in just now.", 2500); $("#ckgo").disabled = false; }
  };
}
function streakLine() {
  const a = FIT && FIT.achievements; if (!a) return "";
  return `<div class="streak"><span>${ic("flame")} <b>${a.streak}</b> streak</span><span>· ${a.this_week} this week</span><span>· ${a.earned}/${a.badges.length} badges</span>
    <span class="badges2">${a.badges.map(b => `<span class="${b.earned ? "on" : ""}" title="${esc(b.name)} — ${esc(b.desc)}${b.earned ? "" : " (" + Math.round(b.progress * 100) + "%)"}">${b.icon}</span>`).join("")}</span></div>`;
}
function celebrate(badges) {
  confetti();
  const b = badges[0];
  speak(`New badge unlocked: ${b.name}! ${b.desc}.${badges.length > 1 ? ` And ${badges.length - 1} more.` : ""} ${pick(["Magnificent, sir.", "I've framed it. Digitally.", "The trophy cabinet grows."])}`, "surprised");
}
function confetti() {
  const c = $("#confetti"), x = c.getContext("2d"), W2 = c.width = innerWidth, H2 = c.height = innerHeight;
  const cols = ["#4fc3f7", "#9d7bff", "#5ee08a", "#ffb300", "#ff5c7a", "#38f0ff"];
  const ps = Array.from({ length: 140 }, () => ({ x: W2 / 2 + (Math.random() - .5) * 80, y: H2 * .3, vx: (Math.random() - .5) * 9, vy: -Math.random() * 9 - 3,
    r: 3 + Math.random() * 4, c: pick(cols), a: Math.random() * 6, s: (Math.random() - .5) * .3 }));
  const t0 = performance.now();
  const f = now => { const t = now - t0; x.clearRect(0, 0, W2, H2);
    ps.forEach(p => { p.vy += .22; p.x += p.vx; p.y += p.vy; p.a += p.s; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.globalAlpha = Math.max(0, 1 - t / 2600);
      x.fillStyle = p.c; x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore(); });
    if (t < 2600) requestAnimationFrame(f); else x.clearRect(0, 0, W2, H2); };
  requestAnimationFrame(f);
}

/* ============================== messages from Jarvis ============================== */
let currentMedia = {};
window.jarvis = {
  handle(msg) {
    switch (msg.type) {
      case "state":
        state = msg.value; $("#state").textContent = LABELS[state] || state;
        if (state !== "sleeping") lastActive = performance.now();
        if (state === "listening") { const l = $("#log").lastElementChild; if (l) l.dataset.open = "0"; }
        break;
      case "level": level = Math.min(1, msg.value); break;
      case "line":
        addLine(msg.who, msg.text);
        if (msg.who === "jarvis") { const b = $("#bubble"); const prev = b.classList.contains("on") && b.dataset.from === "jarvis" ? b.textContent + " " : "";
          bubble((prev + msg.text).slice(-220), 7000); b.dataset.from = "jarvis"; }
        else $("#bubble").dataset.from = "";
        break;
      case "media":
        currentMedia = msg; $("#media-img").src = msg.src; $("#media-cap").textContent = msg.caption || "";
        $("#media-link").style.display = (msg.link || msg.path) ? "" : "none"; $("#media").classList.add("show"); show("chat");
        break;
      case "media_clear": $("#media").classList.remove("show"); break;
      case "mode":
        if (document.body.classList.contains("mini")) $("#miniBtn").click();
        if (msg.value === "joke") speak(pick(JOKES), "smug");
        else if (msg.value === "stretch") stretch();
        else show(msg.value === "dashboard" ? "dash" : msg.value);
        if (msg.value === "workout") setTimeout(() => { const g = $("#go"); if (g) g.click(); }, 1200);
        if (msg.value === "play" && msg.game) setTimeout(() => startGame(String(msg.game)), 150);   // from the companion's Play menu
        break;
      case "timers": TIMERS = msg.value || []; paintChips(); break;
      case "notify":
        if (msg.category === "reminders" || !quiet()) { setMood(msg.category === "alerts" ? "surprised" : "happy", 3000); bubble(`${msg.title}: ${msg.body}`, 8000); }
        break;
      case "focus": setFocus(msg.value); break;
      case "badges":
        for (const [id, on] of Object.entries(msg.value)) { const el = document.getElementById("b-" + id); if (!el) continue;
          if (typeof on === "string") { el.textContent = on; el.classList.toggle("on", !!on); } else el.classList.toggle("on", !!on); }
        break;
    }
  }
};
$("#media-img").onclick = () => API() && API().open(currentMedia.path);
$("#media-link").onclick = () => API() && API().open(currentMedia.link || currentMedia.path);
window.addEventListener("pywebviewready", async () => {
  loadFit();
  const [t, f] = await Promise.all([call("GET", "/api/timers"), call("GET", "/api/focus")]);
  if (t.ok) { TIMERS = t.data.timers || []; paintChips(); }
  if (f.ok) setFocus(f.data);
  setTimeout(() => { if ((state === "starting" || state === "sleeping") && !quiet()) bubble(quip(), 6000); }, 2500);
  setInterval(watch, 20000); watch();
});
</script>
