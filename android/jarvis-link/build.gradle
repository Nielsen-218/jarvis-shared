// Jarvis Link: plain Java, no libraries. Gradle needs the internet here (the local cache lacks the AGP 8.9.1 jars);
// the offline build is build.ps1 (see README.md).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
