[pytest]
# voice_test.py at the repo root is a manual voice-audition script (it calls the live TTS service
# on import), not a test, so only collect the real suites.
testpaths = tests hub
markers =
    real_jobs: the test deliberately runs real heavy work (rigging, practice); everything else is blocked from doing so
    serial: the gate runs it alone after the parallel batch (timing tests, tests that share files on disk)
