<html lang="en">
<head>

<link rel="stylesheet" href="/design-system.css">
<style>
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg-0); color: var(--text-1); font: 400 var(--fs-md)/var(--lh-md) var(--font-ui); }
  header { position: sticky; top: 0; z-index: 5; display: grid; gap: var(--s-2);
    padding: calc(var(--s-2) + var(--safe-t)) var(--s-4) var(--s-2); background: color-mix(in srgb, var(--bg-0) 92%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-1); }
  .bar { display: flex; align-items: center; gap: var(--s-2); }
  .bar h1 { font: 600 var(--fs-lg)/var(--lh-lg) var(--font-display); flex: 1; }
  .ds-tabs { display: flex; gap: var(--s-1); } .ds-tabs .ds-tab { flex: 1; }
  main { max-width: 760px; margin: 0 auto; padding: var(--s-4) var(--s-4) calc(var(--s-8) + var(--safe-b)); display: grid; gap: var(--s-4); }
  section { display: grid; gap: var(--s-3); } [hidden] { display: none !important; }
  .ds-card { padding: var(--s-4); display: grid; gap: var(--s-3); }
  .head { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
  .head b { font: 600 var(--fs-md)/var(--lh-md) var(--font-ui); flex: 1; min-width: 0; }
  .sub { color: var(--text-2); font-size: var(--fs-sm); line-height: var(--lh-sm); }
  .hero h2 { font: 600 var(--fs-xl)/var(--lh-xl) var(--font-display); letter-spacing: -0.01em; }
  .hero .ds-btn.primary { min-height: 56px; font-size: var(--fs-md); font-weight: 600; }
  .why { display: grid; grid-template-columns: auto 1fr; gap: var(--s-2) var(--s-3); align-items: start; padding: var(--s-3);
    border-radius: var(--r-2); background: var(--warn-soft); border: 1px solid var(--line-1); }
  .why p { font-size: var(--fs-sm); line-height: var(--lh-sm); }
  .why.calm { background: var(--bg-2); }
  .rows { display: grid; gap: var(--s-2); }
  .ex { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--s-3); align-items: center; padding: var(--s-3); border-radius: var(--r-2);
    background: var(--bg-2); border: 1px solid var(--line-1); }
  .ex b { font: 600 var(--fs-sm)/var(--lh-sm) var(--font-ui); } .ex small { grid-column: 1 / -1; color: var(--text-2); font-size: var(--fs-xs); }
  .ex .num { font: 600 var(--fs-sm)/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-1); white-space: nowrap; }
  .ex.done { opacity: .62; } .ex.now { border-color: var(--accent); }
  .meter { height: 6px; border-radius: var(--r-pill); background: var(--bg-3); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width var(--dur-base) var(--ease-out); }
  .live { grid-template-columns: 1fr; }
  .live .top { display: grid; grid-template-columns: 96px 1fr; gap: var(--s-3); align-items: center; }
  svg.fig { width: 96px; height: 96px; background: var(--bg-2); border-radius: var(--r-3); border: 1px solid var(--line-1); }
  .live h2 { font: 600 var(--fs-xl)/var(--lh-xl) var(--font-display); letter-spacing: -0.01em; }
  .target { font: 600 var(--fs-2xl)/1.15 var(--font-display); font-variant-numeric: tabular-nums; }
  .target small { font: 400 var(--fs-sm)/1 var(--font-ui); color: var(--text-2); }
  .dots { display: flex; gap: var(--s-2); flex-wrap: wrap; }
  .dot { min-width: 56px; padding: var(--s-2); border-radius: var(--r-2); border: 1px solid var(--line-2); text-align: center;
    font: 500 var(--fs-xs)/1.3 var(--font-mono); color: var(--text-3); }
  .dot.done { background: var(--ok-soft); border-color: transparent; color: var(--ok); } .dot.now { border-color: var(--accent); color: var(--text-1); }
  .steps { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
  .step { display: grid; gap: var(--s-1); } .step label { color: var(--text-2); font-size: var(--fs-xs); }
  .step div { display: grid; grid-template-columns: var(--tap) 1fr var(--tap); gap: var(--s-1); }
  .step input { text-align: center; font: 600 var(--fs-lg)/1 var(--font-mono); min-width: 0; padding: 0 var(--s-1); }
  .chips { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; }
  .row2 { display: flex; gap: var(--s-2); flex-wrap: wrap; } .row2 > .ds-btn { flex: 1; }
  .rest { display: grid; grid-template-columns: 72px 1fr auto; gap: var(--s-3); align-items: center; padding: var(--s-3); border-radius: var(--r-3);
    background: var(--accent-soft); }
  .rest svg { width: 72px; height: 72px; transform: rotate(-90deg); }
  .rest circle { fill: none; stroke-width: 6; } .rest .trk { stroke: var(--bg-3); } .rest .arc { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .rest b { font: 600 var(--fs-2xl)/1 var(--font-mono); font-variant-numeric: tabular-nums; } .rest span { display: block; color: var(--text-2); font-size: var(--fs-xs); }
  .cues p { font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--text-2); } .cues b { color: var(--text-1); }
  .pick { display: grid; gap: var(--s-2); } .pick > span { color: var(--text-2); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; }
  .day { display: grid; grid-template-columns: 44px 1fr auto; gap: var(--s-3); align-items: center; padding: var(--s-3); border-radius: var(--r-2);
    background: var(--bg-2); border: 1px solid var(--line-1); }
  .day.today { border-color: var(--accent); } .day > b { font: 600 var(--fs-sm)/1 var(--font-mono); color: var(--text-2); }
  .day p { font: 500 var(--fs-sm)/var(--lh-sm) var(--font-ui); } .day small { color: var(--text-2); font-size: var(--fs-xs); display: block; }
  details.day { display: block; } details.day summary { display: grid; grid-template-columns: 44px 1fr auto; gap: var(--s-3); align-items: center; cursor: pointer; list-style: none; }
  details.day summary::-webkit-details-marker { display: none; } details.day ul { margin: var(--s-3) 0 0 56px; padding: 0; list-style: none; display: grid; gap: var(--s-1); }
  details.day li { display: flex; justify-content: space-between; gap: var(--s-3); font-size: var(--fs-xs); color: var(--text-2); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
  .stat { padding: var(--s-3); border-radius: var(--r-2); background: var(--bg-2); border: 1px solid var(--line-1); }
  .stat b { display: block; font: 600 var(--fs-xl)/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
  .stat span { color: var(--text-2); font-size: var(--fs-xs); }
  .lift { display: grid; grid-template-columns: 1fr 120px; gap: var(--s-3); align-items: center; padding: var(--s-3); border-radius: var(--r-2);
    background: var(--bg-2); border: 1px solid var(--line-1); }
  .lift b { font: 600 var(--fs-sm)/var(--lh-sm) var(--font-ui); display: block; } .lift span { font: 600 var(--fs-lg)/1.2 var(--font-mono); }
  .lift small { color: var(--text-2); font-size: var(--fs-xs); margin-left: var(--s-2); } .lift small.up { color: var(--ok); } .lift small.down { color: var(--danger); }
  svg.spark { width: 120px; height: 44px; } svg.spark path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  svg.spark circle { fill: var(--accent); }
  .vol { display: grid; grid-template-columns: 92px 1fr 34px; gap: var(--s-2); align-items: center; font-size: var(--fs-xs); color: var(--text-2); }
  .vol svg { width: 100%; height: 14px; } .vol .band { fill: var(--accent-soft); } .vol .trk { fill: var(--bg-3); }
  .vol .val { fill: var(--accent); } .vol .val.low { fill: var(--warn); } .vol .val.high { fill: var(--danger); }
  .vol b { font: 600 var(--fs-xs)/1 var(--font-mono); color: var(--text-1); text-align: right; }
  svg.weeks { width: 100%; height: 96px; } svg.weeks rect { fill: var(--accent); } svg.weeks rect.zero { fill: var(--bg-3); }
  svg.weeks text { fill: var(--text-3); font: 500 10px var(--font-mono); text-anchor: middle; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: var(--s-1) var(--s-4); font-size: var(--fs-sm); } .kv span { color: var(--text-2); }
  .check { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); } .check label { display: grid; gap: var(--s-1); color: var(--text-2); font-size: var(--fs-xs); }
  .busy { display: flex; align-items: center; gap: var(--s-2); color: var(--text-2); font-size: var(--fs-sm); }
  a.plain { color: var(--accent); text-decoration: none; }
  .drills { display: grid; gap: var(--s-2); } .phase { color: var(--text-3); font: 500 var(--fs-xs)/1 var(--font-ui); text-transform: uppercase; letter-spacing: .06em; margin-top: var(--s-1); }
  details.drill { border-radius: var(--r-2); background: var(--bg-2); border: 1px solid var(--line-1); }
  details.drill[open] { border-color: var(--accent); } details.drill.checked { opacity: .62; }
  details.drill summary { display: grid; grid-template-columns: 56px 1fr auto; gap: var(--s-3); align-items: center; padding: var(--s-2) var(--s-3); cursor: pointer; list-style: none; min-height: var(--tap); }
  details.drill summary::-webkit-details-marker { display: none; }
  details.drill summary b { font: 600 var(--fs-sm)/var(--lh-sm) var(--font-ui); display: block; } details.drill summary small { color: var(--text-2); font-size: var(--fs-xs); }
  details.drill svg.fig { width: 56px; height: 56px; border-radius: var(--r-2); }
  details.drill .cues { padding: 0 var(--s-3) var(--s-3); display: grid; gap: var(--s-1); }
  .chart { width: 100%; height: auto; display: block; } .chart .grid { stroke: var(--line-1); stroke-width: 1; }
  .chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; } .chart .pt { fill: var(--accent); }
  .chart.ok .ln { stroke: var(--ok); } .chart.ok .pt { fill: var(--ok); } .chart.warn .ln { stroke: var(--warn); } .chart.warn .pt { fill: var(--warn); }
  .chart .goal { stroke: var(--ok); stroke-width: 1; stroke-dasharray: 4 4; } .chart text { fill: var(--text-3); font: 500 10px var(--font-mono); } .chart text.g { fill: var(--ok); text-anchor: end; }
  .chart text.r { text-anchor: end; fill: var(--text-2); }
  .chart-empty { color: var(--text-2); font-size: var(--fs-sm); }
  details.wk > summary { cursor: pointer; font: 600 var(--fs-md)/var(--lh-md) var(--font-ui); list-style: none; display: flex; gap: var(--s-2); align-items: center; }
  details.wk > summary::-webkit-details-marker { display: none; } details.wk > summary span:first-child { flex: 1; } details.wk[open] > summary { margin-bottom: var(--s-3); }
  @media (max-width: 380px) { .steps { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr 1fr; } }
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
if (location.hash.startsWith("#t=")) { try { localStorage.setItem("jarvis_token", decodeURIComponent(location.hash.slice(3))); } catch (e) {} history.replaceState(null, "", location.pathname); }
let token = null; try { token = localStorage.getItem("jarvis_token"); } catch (e) {}
let D = null, C = null, busy = false, lastMessage = "", showCues = false, editPlan = false, pickRir = null, draft = {};
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let voiceOn = store.get("fit:voice", false);
let choice = store.get("fit:choice", { goal: "", days_per_week: 4, session_minutes: 60, equipment: "gym", training_months: 6 });

async function api(path, body) {
  const opts = { method: body ? "POST" : "GET", headers: { Authorization: `Bearer ${token}` } };
  if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  if (!r.ok) { let m = "Something went wrong."; try { m = (await r.json()).detail || m; } catch (e) {} throw new Error(r.status === 401 ? "Link this phone in the Jarvis app first." : m); }
  return r.json();
}
let toastT; function toast(msg, kind) { const t = $("#toast"); t.textContent = msg; t.className = "ds-toast " + (kind || ""); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4200); }

const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const num = v => Number.isFinite(+v) ? String(+(+v).toFixed(1)) : "";

  if (t.status !== "train") {
    const next = C.week.find(d => d.date > t.date && d.title);
    el.innerHTML = said + `<div class="ds-card hero"><div class="head"><span class="ds-badge">Week ${esc(t.week ?? "")}</span><span class="sub">${esc(t.focus || "")}</span></div><h2>${t.status === "before" ? "Your plan starts soon" : "Rest day"}</h2>
      <p class="sub">${next ? `Next: ${esc(next.title)} on ${esc(next.day)}.` : "Nothing else is planned this week."} Walk, stretch, sleep well.</p>${whyCards(t.adjustments)}</div>` + cooldownCard({ ...t, items: [] }) + checkinCard();
    return;
  }
  const finished = t.session.ended || t.items.every(i => i.skipped || i.done.length >= i.count);
  el.innerHTML = said + `<div class="ds-card hero"><div class="head"><span class="ds-badge accent">Week ${esc(t.week)}</span><span class="sub" style="flex:1">${esc(t.focus || "")}</span><span class="sub">${plural(t.items.length, "exercise")} · about ${t.minutes} min</span></div>
    <h2>${esc(t.title)}</h2>${t.why ? `<p class="sub">${esc(t.why)}</p>` : ""}
    ${whyCards(t.adjustments)}
    <button class="ds-btn primary wide" data-act="start">${busy ? `<span class="ds-spinner"></span>` : ""}${finished ? "Open today's workout again" : t.items.some(i => i.done.length) ? "Continue workout" : "Start workout"}</button>
    <p class="sub">Hands busy? Say "start my workout", then report each set: "8 at 135".</p></div>`
    + (D.checkin ? "" : checkinCard()) + warmupCard(t)
    + `<div class="ds-card"><div class="head"><b>What you will do</b></div><div class="rows">${t.items.map((x, i) => exRow(x, i, -1)).join("")}</div></div>` + cooldownCard(t) + (D.checkin ? checkinCard() : "");
}

/* ---------- week, progress, more ---------- */
function renderWeek() {
  const el = $("#week");
  if (!C || !C.week.length) { el.innerHTML = empty("No plan yet", "Set a goal on the Today tab and the week appears here."); return; }
  const state = d => d.done ? `<span class="ds-badge ok">Done</span>` : d.today ? `<span class="ds-badge accent">Today</span>` : d.missed ? `<span class="ds-badge warn">Missed</span>` : d.moved_from ? `<span class="ds-badge">Moved</span>` : "";
  el.innerHTML = `<div class="ds-card"><div class="head"><b>${esc(C.plan.name || "This week")}</b><button class="ds-btn sm" data-act="edit-plan">Change plan</button></div>
    ${C.plan.why ? `<p class="sub">${esc(C.plan.why)}</p>` : ""}${(C.plan.notes || []).map(n => `<p class="sub">${esc(n)}</p>`).join("")}
    <div class="rows">${C.week.map(d => d.title ? `<details class="day ${d.today ? "today" : ""}"><summary><b>${esc(d.day)}</b><div><p>${esc(d.title)}</p><small>${plural(d.items.length, "exercise")}${d.moved_from ? ` · moved from ${esc(d.moved_from)}` : ""}</small></div>${state(d)}</summary>
      <ul>${d.items.map(i => `<li><span>${esc(i.exercise)}</span><span>${esc(i.sets)} x ${esc(i.reps)}</span></li>`).join("")}</ul></details>`
      : `<div class="day ${d.today ? "today" : ""}"><b>${esc(d.day)}</b><div><p class="sub">Rest</p></div>${state(d)}</div>`).join("")}</div></div>
    ${allWeeksCard()}<div class="ds-card"><div class="head"><b>Why it changed</b></div>${C.changes.length ? C.changes.map(c => `<div class="why calm"><span class="ds-badge">${esc(c.date.slice(5).replace("-", "/"))}</span><p>${esc(c.reason)}</p></div>`).join("") : `<p class="sub">Nothing has been changed in the last two weeks. When I move a session, trim a day or change a load, the reason is listed here.</p>`}</div>`;
}
function renderProgress() {
  const el = $("#progress");
  if (!C) { el.innerHTML = empty("No progress yet", "Log a set and your numbers appear here.") + garminCards(); return; }
  const p = C.progress, a = D.achievements || {}, wk = p.weeks[p.weeks.length - 1] || { sets: 0 };
  const stats = `<div class="stats"><div class="stat"><b>${a.streak ?? 0}</b><span>workout streak</span></div><div class="stat"><b>${wk.sets}</b><span>sets this week</span></div><div class="stat"><b>${p.sets_total}</b><span>sets logged</span></div></div>`;
  if (!p.sets_total) { el.innerHTML = stats + empty("No sets logged yet", "Start a workout and log your sets. Estimated strength per lift and weekly volume per muscle show up after the first session.") + garminCards(); return; }
  const muscles = Object.entries(p.volume).sort((x, y) => y[1] - x[1]);
  el.innerHTML = stats + `<div class="ds-card"><div class="head"><b>Estimated strength</b><span class="sub">one-rep max, from reps and reps left</span></div>
    ${p.lifts.length ? `<div class="rows">${p.lifts.map(l => `<div class="lift"><div><b>${esc(l.name)}</b><span>${Math.round(l.now)} lb</span><small class="${l.change > 0 ? "up" : l.change < 0 ? "down" : ""}">${l.change > 0 ? "+" : ""}${l.change ? num(l.change) : "first session"}</small></div>${spark(l.points)}</div>`).join("")}</div>` : `<p class="sub">Sets of 10 reps or fewer with a weight give an estimate. Nothing qualifies yet.</p>`}</div>
    <div class="ds-card"><div class="head"><b>Hard sets this week</b><span class="sub">target ${p.range[0]} to ${p.range[1]} per muscle</span></div><div class="rows">${muscles.map(([m, v]) => volumeRow(m[0].toUpperCase() + m.slice(1), v, p.range)).join("")}</div></div>
    <div class="ds-card"><div class="head"><b>Sets per week</b></div>${weekBars(p.weeks)}</div>` + garminCards();
}
function renderMore() {
  const p = D.profile || {}, g = C ? C.goal : {}, t = (D.aft_tests || [])[D.aft_tests.length - 1];
  const kv = rows => `<div class="kv">${rows.filter(r => r[1]).map(r => `<span>${esc(r[0])}</span><b>${esc(r[1])}</b>`).join("")}</div>`;
  $("#more").innerHTML = `<div class="ds-card"><div class="head"><b>Your training profile</b><button class="ds-btn sm" data-act="edit-plan">Change</button></div>
    ${kv([["Goal", C && g.key ? C.goals[g.key] : "Not set"], ["Days a week", g.days], ["Minutes", g.minutes], ["Level", g.level], ["Equipment", g.equipment || p.equipment], ["Test date", p.test_date], ["Injuries", p.injuries]])}</div>
    <div class="ds-card"><div class="head"><b>Army Fitness Test</b>${t && t.total ? `<span class="ds-badge accent">${esc(t.total)} / 500</span>` : ""}</div>
    ${t ? kv([["Date", t.date], ...Object.entries(t.points || {}).map(([k, v]) => [k.toUpperCase(), `${v} pts`])]) : `<p class="sub">No test logged yet. Tell Jarvis your results after the next one and the points show here.</p>`}</div>
    ${D.readiness ? `<div class="ds-card"><div class="head"><b>Recovery</b></div><p class="sub">${esc(D.readiness)}</p></div>` : ""}
    ${(D.health || []).length ? `<div class="ds-card"><div class="head"><b>Health notes</b></div>${D.health.map(h => `<p class="sub"><b>${esc(h.title || "")}</b> ${esc(h.text || h.note || "")}</p>`).join("")}</div>` : ""}
    <div class="ds-card"><p class="sub">Food is half of it. <a class="plain" href="/kitchen.html">Open the kitchen</a></p></div>`;
}
function renderAll() { renderToday(); renderWeek(); renderProgress(); renderMore(); $("#voice").setAttribute("aria-pressed", voiceOn); $("#voice-on").style.display = voiceOn ? "" : "none"; }

/* ---------- actions ---------- */
function take(out) { if (out.data) { D = out.data; C = D.coach; } if (out.message) { lastMessage = out.message; speak(out.message); } }
async function coach(body) {
  if (busy) return null; busy = true; renderToday();
  try { const out = await api("/api/fitness/coach", body); take(out); return out; }
  catch (e) { toast(e.message, "danger"); return null; }
  finally { busy = false; renderAll(); }
}
async function logSet(failed) {
  const t = C.today, it = t.items[t.session.current]; if (!it) return;
  const lift = (it.kind || "lift") === "lift", body = { action: "set", exercise: it.key, failed: !!failed };
  if (lift) { body.weight_lbs = parseFloat(($("#w") || {}).value) || 0; body.reps = parseInt(($("#r") || {}).value) || 0; if (pickRir !== null) body.rir = +pickRir; if (failed) body.rir = 0;
    if (!body.reps) { toast("Enter the reps first."); return; } }
  const before = it.done.length, out = await coach(body);
  if (!out) return;
  const now = C.today.items.find(i => i.key === it.key);
  if (now && now.done.length > before) { pickRir = null; const cur = C.today.items[C.today.session.current]; if (C.today.session.open && it.rest_s) startRest(it.rest_s, cur ? cur.exercise : ""); else stopRest(); }
  else toast(out.message || "That set was not saved.");
}
document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { document.querySelectorAll("[data-tab]").forEach(b => { const on = b === tab; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); }); ["today", "week", "progress", "more"].forEach(id => $("#" + id).hidden = id !== tab.dataset.tab); store.set("fit:tab", tab.dataset.tab); return; }
  const chip = e.target.closest("[data-pick] [data-v]");
  if (chip) { const name = chip.parentElement.dataset.pick; if (name === "rir") { pickRir = pickRir === chip.dataset.v ? null : chip.dataset.v; } else { choice[name] = /^\d+$/.test(chip.dataset.v) ? +chip.dataset.v : chip.dataset.v; store.set("fit:choice", choice); }
    keepDraft(); renderToday(); return; }
  const step = e.target.closest("[data-step]");
  if (step) { const box = step.dataset.step === "weight" ? $("#w") : $("#r"); box.value = Math.max(0, (parseFloat(box.value) || 0) + +step.dataset.by); keepDraft(); return; }
  const act = (e.target.closest("[data-act]") || {}).dataset; if (!act) return;
  if (act.act === "drill") { e.preventDefault(); e.stopPropagation(); const k = drillKey(), m = store.get(k, {}); m[act.id] = !m[act.id]; store.set(k, m); renderToday(); return; }
  unlock();
  if (act.act === "start") { if (C.today.session.open) return; await coach({ action: "start" }); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else if (act.act === "set") await logSet(false);
  else if (act.act === "fail") await logSet(true);
  else if (act.act === "skip") { stopRest(); await coach({ action: "skip" }); }
  else if (act.act === "swap") { stopRest(); await coach({ action: "swap" }); }
  else if (act.act === "end") { stopRest(); await coach({ action: "end" }); }
  else if (act.act === "cues") { showCues = !showCues; keepDraft(); renderToday(); }
  else if (act.act === "rest-more") { if (rest) { rest.end += 15000; rest.total += 15; store.set("fit:rest", rest); tickRest(); } }
  else if (act.act === "rest-skip") stopRest();
  else if (act.act === "edit-plan") { editPlan = true; document.querySelector('[data-tab="today"]').click(); renderToday(); }
  else if (act.act === "cancel-plan") { editPlan = false; renderToday(); }
  else if (act.act === "build") { const out = await coach({ action: C.today.status === "none" ? "goal" : "plan", ...choice }); if (out) { editPlan = false; renderAll(); } }
});
function keepDraft() { const w = $("#w"), r = $("#r"); if (w) draft.weight = w.value; if (r) draft.reps = r.value; }
document.addEventListener("input", e => { if (e.target.id === "w" || e.target.id === "r") keepDraft(); });
document.addEventListener("submit", async e => {
  if (e.target.id !== "checkin") return; e.preventDefault();
  const f = new FormData(e.target), body = {}; for (const [k, v] of f) if (v !== "") body[k] = v;
  if (!Object.keys(body).length) { toast("Fill in at least one number."); return; }
  try { const out = await api("/api/fitness/checkin", body); take({ data: out.data }); toast("Check-in saved."); renderAll(); } catch (err) { toast(err.message, "danger"); }
});
$("#voice").addEventListener("click", () => { voiceOn = !voiceOn; store.set("fit:voice", voiceOn); unlock(); renderAll(); toast(voiceOn ? "Spoken cues on." : "Spoken cues off."); });

async function load(quiet) {
  try { D = await api("/api/fitness"); C = D.coach; if (!quiet || !document.activeElement || !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) { keepDraft(); renderAll(); } }
  catch (e) { if (!quiet) $("#today").innerHTML = empty("Could not load the trainer", e.message, `<button class="ds-btn" onclick="load()">Try again</button>`); }
}
const wantTab = new URLSearchParams(location.search).get("tab") || "";
const startTab = /^[a-z]+$/.test(wantTab) ? wantTab : store.get("fit:tab", "today"); if (startTab !== "today") { const b = document.querySelector(`[data-tab="${startTab}"]`); if (b) b.click(); }
/* The Command Center window asks for the workout by voice or tray: begin today's session once the plan has loaded. */
window.addEventListener("message", async e => {
  if (e.source !== parent || e.origin !== location.origin || !e.data || e.data.jarvisCC !== "start-workout") return;
  for (let i = 0; i < 30 && !C; i++) await new Promise(r => setTimeout(r, 300));
  if (C && C.today && C.today.status === "train" && !C.today.session.open) { document.querySelector('[data-tab="today"]').click(); await coach({ action: "start" }); }
});
load();
setInterval(() => { if (!busy && document.visibilityState === "visible" && C && C.today.session.open) load(true); }, 15000);   // sets said out loud show up here
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && D) load(true); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
