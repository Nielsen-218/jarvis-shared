<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Captain America</title>
<meta name="theme-color" content="#05080F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/design-system.css">
<style>
  /* Page-scoped "mission command" layer on top of the J.A.R.V.I.S. design system. Inline SVG and CSS only. */
  :root {
    --pca-0: #05080F; --pca-1: #0A1120; --pca-2: #0F1A2E; --pca-3: #16243C;
    --steel: #8DB4DE; --steel-line: rgba(141, 180, 222, .30); --steel-soft: rgba(141, 180, 222, .10); --glow: rgba(90, 170, 240, .28);
    --red: #C8102E; --red-hi: #DE2440; --red-soft: rgba(222, 36, 64, .16);
    --gold: #E8B84A; --gold-soft: rgba(232, 184, 74, .14);
    --text-3: #8A97AB;   /* raised from the design-system value so meta text keeps AA contrast on navy */
    --cut: 12px;
    --disp: "Bahnschrift SemiCondensed", "Bahnschrift", "Barlow Condensed", "Roboto Condensed", "Avenir Next Condensed", "Arial Narrow", sans-serif-condensed, sans-serif;
    --nav-h: 64px;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--pca-0); color: var(--text-1); font: 400 var(--fs-md)/var(--lh-md) var(--font-ui); }
  body { min-height: 100vh;
    background: radial-gradient(1200px 600px at 70% -10%, rgba(40, 80, 140, .22), transparent 60%),
                radial-gradient(800px 500px at -10% 110%, rgba(200, 16, 46, .08), transparent 60%), var(--pca-0); background-attachment: fixed; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--gold) !important; outline-offset: 2px; }
  .cut:focus-visible, .btn:focus-visible { outline-offset: -4px !important; }
  a { color: var(--steel); }

  /* ---- type ---- */
  .disp { font-family: var(--disp); font-style: italic; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-stretch: condensed; }
  h2.view-h { font: italic 700 var(--fs-2xl)/1.05 var(--disp); text-transform: uppercase; letter-spacing: .03em; }
  h3 { font: italic 700 var(--fs-lg)/1.15 var(--disp); text-transform: uppercase; letter-spacing: .05em; }
  .kick { font: 600 var(--fs-xs)/var(--lh-xs) var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--steel); }
  .sub { color: var(--text-2); font-size: var(--fs-sm); line-height: var(--lh-sm); }
  .meta { color: var(--text-3); font-size: var(--fs-xs); line-height: var(--lh-xs); }
  .num { font-family: var(--disp); font-variant-numeric: tabular-nums; font-weight: 700; }

  /* ---- HUD panels: steel border, thin glow, cut corners ---- */
  .hud { position: relative; padding: var(--s-4); display: grid; gap: var(--s-3);
    background: linear-gradient(180deg, rgba(22, 36, 60, .92), rgba(10, 17, 32, .94)) padding-box,
                linear-gradient(135deg, rgba(141, 180, 222, .55), rgba(141, 180, 222, .12) 40%, rgba(141, 180, 222, .35)) border-box;
    border: 1px solid transparent;
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
    box-shadow: inset 0 0 24px rgba(90, 170, 240, .06); }
  .hud::before { content: ""; position: absolute; top: 0; left: var(--cut); width: 42px; height: 2px; background: var(--steel); opacity: .8; }
  .hud.gold::before { background: var(--gold); }
  .hud.red::before { background: var(--red-hi); }
  .hud.flat { background: rgba(10, 17, 32, .7) padding-box, linear-gradient(135deg, var(--steel-line), rgba(141,180,222,.08)) border-box; }
  .hud.danger { background: linear-gradient(180deg, rgba(90, 14, 26, .55), rgba(30, 8, 14, .8)) padding-box, linear-gradient(135deg, var(--red-hi), rgba(222,36,64,.25)) border-box; }
  .hud.warn { background: linear-gradient(180deg, rgba(80, 58, 14, .45), rgba(26, 20, 8, .8)) padding-box, linear-gradient(135deg, var(--warn), rgba(233,179,80,.2)) border-box; }
  .row { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; }
  .grid2 { display: grid; gap: var(--s-4); grid-template-columns: 1fr; }
  @media (min-width: 1100px) { .grid2 { grid-template-columns: 1.35fr 1fr; align-items: start; } }
  .stack { display: grid; gap: var(--s-4); align-content: start; }

  /* ---- buttons ---- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: var(--tap); padding: 0 var(--s-4);
    border: 1px solid var(--steel-line); background: var(--steel-soft); color: var(--text-1); cursor: pointer; text-decoration: none;
    font: italic 700 var(--fs-md)/1 var(--disp); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    transition: background var(--dur-fast) var(--ease-out), transform var(--dur-instant) var(--ease-out); }
  .btn:hover { background: rgba(141, 180, 222, .2); }
  .btn:active { transform: scale(.98); }
  .btn.red { background: linear-gradient(180deg, var(--red-hi), var(--red)); border-color: #FF5A70; color: #fff; box-shadow: 0 0 18px rgba(222, 36, 64, .35); }
  .btn.red:hover { background: linear-gradient(180deg, #EA3550, #D0142F); }
  .btn.gold { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
  .btn.big { min-height: 60px; font-size: var(--fs-xl); width: 100%; }
  .btn.sm { min-height: var(--tap); padding: 0 var(--s-3); font-size: var(--fs-sm); }
  .btn.wide { width: 100%; }
  .btn:disabled, .btn[aria-disabled="true"] { opacity: .42; cursor: not-allowed; box-shadow: none; }
  .btn[aria-pressed="true"] { background: var(--red-soft); border-color: var(--red-hi); color: #FFC2CB; }
  .chip { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-1); min-height: var(--tap); min-width: var(--tap); padding: 0 var(--s-3);
    border: 1px solid var(--steel-line); background: rgba(10, 17, 32, .6); color: var(--text-1); cursor: pointer; border-radius: 2px;
    font: 600 var(--fs-sm)/1 var(--font-ui); }
  .chip[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
  .chips { display: flex; gap: var(--s-2); flex-wrap: wrap; }
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 1px solid var(--steel-line); color: var(--steel);
    font: 700 11px/18px var(--font-ui); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
  .tag.gold { color: var(--gold); border-color: var(--gold); background: var(--gold-soft); }
  .tag.red { color: #FF9AA8; border-color: var(--red-hi); background: var(--red-soft); }
  .tag.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
  .tag.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
  .tag.dash { border-style: dashed; color: var(--text-2); }
  .ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- shell: left nav on wide screens, bottom tab bar on phones ---- */
  #mock-banner { position: sticky; top: 0; z-index: 60; padding: 6px var(--s-4); text-align: center; background: repeating-linear-gradient(-45deg, #4A2A00, #4A2A00 10px, #3A2000 10px, #3A2000 20px);
    color: #FFD58A; font: 700 var(--fs-xs)/1.4 var(--font-ui); letter-spacing: .12em; text-transform: uppercase; border-bottom: 1px solid var(--warn); }
  .shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; }
  nav#nav { position: fixed; z-index: 40; inset: auto 0 0 0; display: grid; grid-template-columns: repeat(6, 1fr);
    padding: 0 0 var(--safe-b); background: rgba(5, 8, 15, .96); border-top: 1px solid var(--steel-line); backdrop-filter: blur(8px); }
  nav#nav .brand, nav#nav .nav-foot { display: none; }
  .nav-btn { display: grid; justify-items: center; align-content: center; gap: 3px; min-height: var(--nav-h); padding: 4px 0; border: 0; background: none;
    color: var(--text-2); cursor: pointer; font: italic 700 10.5px/1 var(--disp); letter-spacing: .06em; text-transform: uppercase; position: relative; }
  .nav-btn[aria-current="page"] { color: var(--gold); }
  .nav-btn[aria-current="page"]::after { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 2px; background: var(--gold); box-shadow: 0 0 10px var(--gold); }
  .stage { min-width: 0; display: flex; flex-direction: column; }
  main#views { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding: var(--s-4) var(--s-4) calc(var(--nav-h) + var(--s-6) + var(--safe-b)); }
  main#views > section { display: grid; gap: var(--s-4); }
  @media (min-width: 960px) {
    .shell { grid-template-columns: 236px minmax(0, 1fr); }
    nav#nav { position: sticky; top: 0; height: 100vh; inset: auto; grid-template-columns: 1fr; grid-auto-rows: min-content; align-content: start; gap: 2px;
      padding: var(--s-4) var(--s-3); border-top: 0; border-right: 1px solid var(--steel-line); background: linear-gradient(180deg, rgba(10, 17, 32, .96), rgba(5, 8, 15, .98)); }
    nav#nav .brand { display: grid; justify-items: center; gap: var(--s-2); padding: var(--s-2) 0 var(--s-5); text-align: center; }
    nav#nav .brand svg { width: 92px; height: 92px; }
    nav#nav .nav-foot { display: block; margin-top: var(--s-5); padding: var(--s-3); }
    .nav-btn { grid-template-columns: 24px 1fr; justify-items: start; align-items: center; gap: var(--s-3); min-height: 48px; padding: 0 var(--s-4);
      font-size: var(--fs-md); clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px); }
    .nav-btn:hover { background: var(--steel-soft); color: var(--text-1); }
    .nav-btn[aria-current="page"] { background: linear-gradient(90deg, var(--gold-soft), transparent); }
    .nav-btn[aria-current="page"]::after { top: 8px; bottom: 8px; left: 0; right: auto; width: 3px; height: auto; }
    .stage { height: 100vh; }
    body.has-mock .stage { height: calc(100vh - 29px); }
    main#views { flex: 1; min-height: 0; overflow-y: auto; max-width: none; padding: var(--s-5) max(var(--s-6), calc((100% - 1180px) / 2)) var(--s-6); }
  }

  /* ---- header ---- */
  header.top { position: sticky; top: 0; z-index: 30; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s-2); padding: calc(var(--s-2) + var(--safe-t)) var(--s-4) var(--s-3);
    background: linear-gradient(180deg, rgba(5, 8, 15, .97), rgba(5, 8, 15, .88)); border-bottom: 1px solid var(--steel-line); backdrop-filter: blur(10px); }
  body.has-mock header.top { top: 28px; }
  .top-row { display: flex; align-items: center; gap: var(--s-3); }
  .top-row .emblem { width: 44px; height: 44px; flex: none; }
  .title-block { flex: 1; min-width: 0; }
  .title-block h1 { font: italic 800 var(--fs-lg)/1.05 var(--disp); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title-block p { color: var(--text-2); font-size: var(--fs-xs); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hdr-tags .tag { margin-right: 6px; padding: 0 6px; font-size: 10px; line-height: 16px; min-height: 0; vertical-align: 1px; }
  @media (max-width: 480px) { .top-row .emblem { display: none; } }
  .icon-btn { display: inline-grid; place-items: center; width: var(--tap); height: var(--tap); flex: none; border: 1px solid var(--steel-line); background: var(--steel-soft);
    color: var(--text-1); cursor: pointer; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); text-decoration: none; }
  .icon-btn[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); background: var(--gold-soft); }
  @media (min-width: 960px) { .top-row .emblem { display: none; } .title-block h1 { font-size: var(--fs-xl); } }
  .phasebar { display: grid; gap: 4px; }
  .phases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
  .phase { position: relative; height: 22px; display: flex; align-items: center; padding: 0 8px; overflow: hidden;
    border: 1px solid var(--steel-line); background: rgba(10, 17, 32, .7); color: var(--text-2);
    font: italic 700 11px/1 var(--disp); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
  .phase .fill { position: absolute; inset: 0 auto 0 0; background: rgba(141, 180, 222, .18); z-index: 0; }
  .phase span { position: relative; z-index: 1; overflow: hidden; text-overflow: ellipsis; }
  .phase.now { border-color: var(--gold); color: var(--gold); }
  .phase.now .fill { background: linear-gradient(90deg, rgba(232, 184, 74, .35), rgba(232, 184, 74, .12)); }
  .phase.past { color: var(--text-1); }
  .ticks { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
  .ticks i { height: 3px; background: var(--pca-3); }
  .ticks i.past { background: var(--steel); opacity: .6; } .ticks i.now { background: var(--gold); box-shadow: 0 0 6px var(--gold); }

  /* ---- mission view ---- */
  .hero h2 { font: italic 800 var(--fs-3xl)/1 var(--disp); text-transform: uppercase; letter-spacing: .02em; }
  .facts { display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .items { display: grid; gap: 6px; counter-reset: it; }
  .item { display: grid; grid-template-columns: 28px 1fr auto; gap: 2px var(--s-3); align-items: center; padding: 10px var(--s-3);
    background: rgba(5, 8, 15, .45); border-left: 2px solid var(--steel-line); }
  .item::before { counter-increment: it; content: counter(it, decimal-leading-zero); font: italic 700 var(--fs-sm)/1 var(--disp); color: var(--steel); }
  .item b { font: 600 var(--fs-sm)/var(--lh-sm) var(--font-ui); }
  .item .rx { font: 700 var(--fs-sm)/1.2 var(--disp); font-variant-numeric: tabular-nums; color: var(--text-1); text-align: right; white-space: nowrap; }
  .item small { grid-column: 2 / -1; color: var(--text-2); font-size: var(--fs-xs); line-height: 1.45; }
  .item.done { border-left-color: var(--ok); } .item.done::before { content: "\2713"; color: var(--ok); }
  .item.skipped { opacity: .55; } .item.now { border-left-color: var(--gold); background: var(--gold-soft); }
  .adj { display: grid; grid-template-columns: 1fr; gap: var(--s-2); padding: var(--s-3); border-left: 3px solid var(--warn); background: var(--warn-soft); }
  .adj.pain { border-left-color: var(--red-hi); background: var(--red-soft); }
  .adj p { font-size: var(--fs-sm); line-height: var(--lh-sm); }
  .jarvis { display: grid; grid-template-columns: auto 1fr; gap: var(--s-3); align-items: center; }
  .jarvis .play { width: 56px; height: 56px; }
  .wave { display: flex; align-items: center; gap: 3px; height: 28px; }
  .wave i { display: block; width: 3px; background: var(--steel); border-radius: 2px; height: 30%; opacity: .7; }
  .jarvis.speaking .wave i { background: var(--gold); animation: wave 1s ease-in-out infinite; }
  .wave i:nth-child(3n) { animation-delay: -.3s; } .wave i:nth-child(3n+1) { animation-delay: -.6s; } .wave i:nth-child(4n) { animation-delay: -.15s; }
  @keyframes wave { 0%, 100% { height: 20%; } 50% { height: 100%; } }
  .jarvis blockquote { font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--text-2); }
  .baselines { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s-2); }
  .base { display: grid; gap: 4px; align-content: start; padding: var(--s-3); background: rgba(5, 8, 15, .45); border-top: 2px solid var(--steel-line); min-height: 112px; }
  .base.has { border-top-color: var(--gold); }
  .base .v { font: italic 800 var(--fs-2xl)/1 var(--disp); font-variant-numeric: tabular-nums; }
  .base .empty { color: var(--text-2); font-size: var(--fs-xs); line-height: 1.45; }
  .hist { display: grid; gap: var(--s-2); padding: var(--s-3); border: 1px dashed var(--steel-line); }
  .hist ul { padding-left: 18px; color: var(--text-2); font-size: var(--fs-sm); line-height: var(--lh-sm); }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .wd { display: grid; gap: 4px; align-content: start; min-height: 96px; padding: 8px 6px; background: rgba(5, 8, 15, .45); border: 1px dashed var(--steel-line); }
  .wd b { font: italic 700 var(--fs-sm)/1 var(--disp); text-transform: uppercase; letter-spacing: .06em; }
  .wd p { font-size: 11px; line-height: 1.3; color: var(--text-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .wd.done { border-style: solid; border-color: rgba(109, 213, 160, .5); background: rgba(109, 213, 160, .08); }
  .wd.missed { border-style: solid; border-color: rgba(240, 122, 132, .5); }
  .wd.today { border: 1px solid var(--gold); background: var(--gold-soft); }
  .wd.rest p { color: var(--text-3); }
  .wd .st { font: 700 10px/1.2 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; }
  .wd.done .st { color: var(--ok); } .wd.missed .st { color: var(--danger); } .wd.today .st { color: var(--gold); } .wd .st.plan { color: var(--text-3); }
  @media (max-width: 560px) { .week { grid-template-columns: 1fr; } .wd { grid-template-columns: 44px 1fr auto; align-items: center; min-height: 0; } .wd p { -webkit-line-clamp: 2; } }
  .legend { display: flex; gap: var(--s-3); flex-wrap: wrap; color: var(--text-2); font-size: var(--fs-xs); align-items: center; }
  .sw { display: inline-block; width: 14px; height: 10px; margin-right: 4px; vertical-align: -1px; }
  .sw.plan { border: 1px dashed var(--steel); } .sw.done { background: var(--ok); } .sw.test { background: var(--gold); border-radius: 50%; width: 10px; }
  .sw.logged { border: 2px solid var(--steel); border-radius: 50%; width: 10px; }
  .form { display: grid; gap: var(--s-3); }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: var(--s-3); }
  label.f { display: grid; gap: 4px; color: var(--text-2); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .04em; }
  .in { width: 100%; min-height: var(--tap); padding: 0 var(--s-3); border: 1px solid var(--steel-line); background: rgba(5, 8, 15, .7); color: var(--text-1);
    font: 400 var(--fs-md)/1 var(--font-ui); border-radius: 2px; }
  textarea.in { padding: var(--s-2) var(--s-3); min-height: 72px; line-height: 1.4; resize: vertical; }
  .in:focus { border-color: var(--gold); outline: none; }
  input[type="range"] { width: 100%; min-height: var(--tap); accent-color: var(--red-hi); }
  .disclaimer { padding: var(--s-4); border-top: 1px solid var(--steel-line); color: var(--text-2); font-size: var(--fs-xs); line-height: 1.6; display: grid; gap: var(--s-2); }

  /* ---- rings ---- */
  .ring { position: relative; display: grid; place-items: center; }
  .ring svg { transform: rotate(-90deg); }
  .ring .trk { fill: none; stroke: var(--pca-3); }
  .ring .arc { fill: none; stroke: var(--gold); stroke-linecap: butt; transition: stroke-dashoffset .4s linear; filter: drop-shadow(0 0 4px rgba(232, 184, 74, .5)); }
  .ring.big .lbl b { font-size: 60px; } .ring.big .lbl > span { font-size: 12px; }
  .ring.red .arc { stroke: var(--red-hi); filter: drop-shadow(0 0 4px rgba(222, 36, 64, .6)); }
  .ring.steel .arc { stroke: var(--steel); }
  .ring .lbl { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .lbl b { font: italic 800 var(--fs-xl)/1 var(--disp); font-variant-numeric: tabular-nums; }
  .ring .lbl > span { font: 600 10px/1.3 var(--font-ui); color: var(--text-2); letter-spacing: .1em; text-transform: uppercase; }

  /* ---- train view ---- */
  .exname { font: italic 800 clamp(28px, 7vw, 48px)/1 var(--disp); text-transform: uppercase; letter-spacing: .01em; }
  .bigline { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: var(--s-2); }
  .metric { padding: var(--s-3); background: rgba(5, 8, 15, .5); border-top: 2px solid var(--steel-line); display: grid; gap: 2px; }
  .metric b { font: italic 800 var(--fs-2xl)/1.05 var(--disp); font-variant-numeric: tabular-nums; }
  .metric.hi { border-top-color: var(--red-hi); } .metric.gold { border-top-color: var(--gold); }
  .metric small { color: var(--text-2); font-size: var(--fs-xs); line-height: 1.4; }
  .sets { display: flex; gap: 6px; flex-wrap: wrap; }
  .set { min-width: 64px; padding: 6px 8px; text-align: center; border: 1px dashed var(--steel-line); color: var(--text-3); font: 600 var(--fs-xs)/1.35 var(--font-mono); }

let actx = null;
function unlock() {
  if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;   // audio may only start after a real tap
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {} }
function tone(freq, start, dur, vol) {
  try { unlock(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + start); o.stop(actx.currentTime + start + dur); } catch (e) {}
}
function beep(kind) {
  if (kind === "short") tone(660, 0, .12, .12);
  else if (kind === "click") tone(1600, 0, .03, .08);
  else { [0, .22, .44].forEach(t => tone(880, t, .14, .14)); if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate([180, 90, 180]); }
}

const voicePlayer = $("#voice-player"), music = $("#music");

function duck(on) { if (prefs().duck === false) return; music.volume = on ? musicBase * 0.25 : musicBase; }
function setSpeaking(on) { $$(".jarvis").forEach(j => j.classList.toggle("speaking", on)); }
voicePlayer.addEventListener("ended", () => { duck(false); setSpeaking(false); });

voicePlayer.addEventListener("pause", () => { duck(false); setSpeaking(false); });
async function say(text, force) {
  if (!text || (!force && prefs().voice === false)) return false;
  try {
    const out = await api("/api/say", { text: String(text).slice(0, 400) });
    if (!out || !out.audio) { if (force) toast(MOCK ? "Mock mode: Jarvis's voice is not available here." : "Jarvis's voice is not available right now."); return false; }
    voicePlayer.src = out.audio; voicePlayer.volume = clamp01(prefs().voice_level ?? 1); duck(true); setSpeaking(true);
    await voicePlayer.play(); return true;
  } catch (e) { duck(false); setSpeaking(false); if (force) toast("Could not play Jarvis's voice."); return false; }
}

  const left = Math.max(0, Math.ceil((rest.end - Date.now()) / 1000));

  if (left <= 0) { const nx = rest.next; stopRest(); beep(); toast("Rest is over. Go."); if (speakFor("normal")) say(nx ? "Rest is over. " + nx : "Rest is over."); return; }
  if (box) { box.hidden = false; const b = box.querySelector(".lbl b"); if (b) b.textContent = mmss(left); setRing(box.querySelector(".ring"), left / rest.total); }
  restT = setTimeout(tickRest, 250);
}

function lineChart(points, { invert = false, fmt = v => String(v), label = "chart" } = {}) {
  const W = 340, H = 150, pad = 30, ys = points.map(p => p.y);
  let lo = Math.min(...ys), hi = Math.max(...ys); if (lo === hi) { lo -= 1; hi += 1; }
  const X = i => pad + (points.length === 1 ? (W - 2 * pad) / 2 : i * (W - 2 * pad) / (points.length - 1));
  const Y = v => { const t = (v - lo) / (hi - lo); return invert ? 14 + t * (H - pad - 14) : H - pad - t * (H - pad - 14); };
  const d = points.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const last = points[points.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}: ${points.map(p => `${p.x} ${fmt(p.y)} (${p.src})`).join(", ")}">
    <line class="grid" x1="${pad}" x2="${W - pad}" y1="${H - pad}" y2="${H - pad}"/>${points.length > 1 ? `<path class="ln" d="${d}"/>` : ""}
    ${points.map((p, i) => `<circle class="pt ${p.src === "test" ? "test" : p.src === "garmin" ? "garmin" : "logged"}" cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="5"><title>${esc(p.x)}: ${esc(fmt(p.y))} (${esc(p.src)})</title></circle>
      <text x="${X(i).toFixed(1)}" y="${(Y(p.y) - 9).toFixed(1)}" text-anchor="middle">${esc(fmt(p.y))}</text>`).join("")}
    <text x="${pad}" y="${H - 10}">${esc(points[0].x)}</text>${points.length > 1 ? `<text class="r" x="${W - pad}" y="${H - 10}">${esc(last.x)}</text>` : ""}</svg>`;
}
function weekBars(rows, planKey, doneKey, label, curWeekN) {

    ${rows.map((r, i) => { const x = 5 + i * bw, ph = 90 * (+r[planKey] || 0) / max, dh = doneKey && r[doneKey] != null ? 90 * (+r[doneKey]) / max : 0;

    case "dj-rm": { const dj = djOf(); if (!dj) break; await act("music_taste", { [a.dataset.kind]: (dj.taste[a.dataset.kind] || []).filter(x => x !== a.dataset.v) }, { quiet: true }); audioSheet(); break; }

    case "end-no": endAsk = false; render(); break;

    case "ob-step": obStep = Math.max(0, +a.dataset.i); store.set("obstep", obStep); render(); toTop(false); break;
    case "ob-goto": { const qs2 = ((D.onboarding || {}).questions) || [], q2 = qs2.find(x => x.id === a.dataset.q);
      const gs = GROUPS.map(g => ({ ...g, qs: qs2.filter(x => groupOf(x) === g.id) })).filter(g => g.qs.length);

      const el2 = document.getElementById("q-" + a.dataset.q + "-l"); if (el2) el2.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
      break; }
    case "ob-finish": { const bp = document.getElementById("begin-panel"); if (bp) bp.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" }); break; }
    case "answer-chip": { const v = JSON.parse(a.dataset.v); await act("answer", { id: a.dataset.q, value: v }, { quiet: true }); break; }
    case "answer-multi": { const q = (D.onboarding.questions || []).find(x => x.id === a.dataset.q); const cur = Array.isArray(q && q.value) ? q.value.slice() : [];
      const v = a.dataset.v, i = cur.indexOf(v); if (i < 0) cur.push(v); else cur.splice(i, 1); await act("answer", { id: a.dataset.q, value: cur }, { quiet: true }); break; }

      if (t && t.session && t.session.ended && !t.session.open) { if (a.closest('section[data-view="mission"]')) { go("train", true); break; } }

    case "rir": pickRir = pickRir === +a.dataset.v ? null : +a.dataset.v; $$('[data-act="rir"]').forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === pickRir))); break;
    case "fail-toggle": failNext = !failNext; keepDraft(); render(); break;

    case "tap-done": { const it = t.items[t.session.current]; if (it) await doSet(it, { exercise: it.key, reps: it.kind === "power" ? (it.lo || 1) : 1, weight_lbs: 0, failed: false }); break; }
    case "hold-toggle": if (hold) { if (hold.running) { hold.acc += (Date.now() - hold.t0) / 1000; hold.running = false; } else { hold.t0 = Date.now(); hold.running = true; } a.textContent = hold.running ? "Stop hold" : "Resume hold"; tickHold(); } break;
    case "hold-reset": if (hold) { hold.acc = 0; hold.running = false; hold.beeped = false; tickHold(); render(); } break;
    case "hold-log": { const it = t.items[t.session.current]; if (!it || !hold) break; const manual = parseInt(($("#hold-manual") || {}).value, 10);

function keepDraft() { const w = $("#w"), r = $("#r"); if (w) draft.weight = w.value; if (r) draft.reps = r.value; }
document.addEventListener("input", e => {
  if (e.target.id === "w" || e.target.id === "r") keepDraft();
  if (e.target.id === "learn-q") { learnQ = e.target.value; $("#learn-list").innerHTML = learnList(); }
  if (e.target.name === "level" && e.target.closest("#pain-form")) $("#pain-out").textContent = e.target.value;
});
document.addEventListener("change", async e => {
  const n = e.target;
  if (n.dataset && n.dataset.answer) {
    let v = n.value.trim();
    if (n.dataset.kind === "number") v = v === "" ? null : +v;
    if (n.dataset.kind === "time" && v && parseTime(v) === null) { toast("Use minutes and seconds, like 18:50."); return; }
    await act("answer", { id: n.dataset.answer, value: v }, { quiet: true });
  }
  if (n.matches && n.matches("[data-files]")) { localFiles = [...n.files].filter(f => f.type.startsWith("audio/")); localI = 0; music.dataset.name = ""; if (localFiles.length) playLocal(); renderDock(); if ($("#sheet-root").innerHTML) audioSheet(); }
});
document.addEventListener("submit", async e => {
  const f = e.target; e.preventDefault();
  const fd = Object.fromEntries(new FormData(f).entries());
  if (f.id === "checkin") {
    const body = {}; for (const [k, v] of Object.entries(fd)) if (v !== "") body[k] = +v;
    if (!Object.keys(body).length) { toast("Fill in at least one number."); return; }
    try { const out = await api("/api/fitness/checkin", body); redoCheckin = false; toast(out.message || "Check-in saved.", "ok"); await load(true); render(); } catch (err) { toast(err.message, "danger"); }
  } else if (f.id === "test-form") {
    const ev = f.dataset.event, v = TIMED[ev] ? parseTime(fd.value) : +fd.value;
    if (!ev) { toast("This test has no event name; it cannot be saved here."); return; }
    if (v === null || !Number.isFinite(v) || v <= 0) { toast(TIMED[ev] ? "Enter the time as m:ss." : "Enter the number."); return; }
    await act("test", { event: ev, value: v });
  } else if (f.id === "trial-form") {
    const v = parseTime(fd.value); if (!v) { toast("Enter the time as m:ss."); return; }
    await act("test", { event: "run", value: v });
  } else if (f.id === "run-log") {
    const rpe = $('[data-act="run-rpe"][aria-pressed="true"]', f);
    if (!rpe) { toast("Pick an effort from 1 to 10."); return; }
    const body = { minutes: +fd.minutes, rpe: +rpe.dataset.v, kind: f.dataset.kind || undefined };
    if (fd.distance_mi) body.distance_mi = +fd.distance_mi; if (fd.completed_reps) body.completed_reps = +fd.completed_reps; if (fd.slow_reps) body.slow_reps = +fd.slow_reps; if (fd.notes) body.notes = fd.notes;
    const out = await act("run", body); if (out && out.ok !== false) { RT = null; keepAwake(false); render(); }
  } else if (f.id === "pain-form") {
    closeSheet(); await act("pain", { area: fd.area, level: +fd.level, ...(fd.note ? { note: fd.note } : {}) });
  } else if (f.id === "unit-form") {
    const body = { kind: fd.kind, minutes: +fd.minutes, rpe: +fd.rpe }; if (fd.miles) body.miles = +fd.miles;
    closeSheet(); await act("external", body);
  } else if (f.id === "dj-add-form") {

document.addEventListener("keydown", e => { if (e.key === "Escape" && SHEETS.length) backSheet(); });
$("#voice-btn").addEventListener("click", async () => { const on = prefs().voice === false; await act("audio", { prefs: { ...prefs(), voice: on } }, { quiet: true }); toast(on ? "Jarvis voice cues on." : "Voice cues off: beeps only."); });

/* ================= load ================= */
async function load(quiet) {
  try { D = await api("/api/pca"); if (!quiet || !document.activeElement || !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) { keepDraft(); render(); } pairBanner(); }
  catch (e) { if (!quiet) $('section[data-view="mission"]').innerHTML = `<div class="hud danger"><h3>Could not load the mission</h3><p class="sub">${esc(e.message)}</p><button class="btn" onclick="load()">Try again</button></div>`; }
}
async function boot() {
  if (MOCK) {
    document.body.classList.add("has-mock"); $("#mock-banner").hidden = false;
    await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "captain-mock.js"; s.onload = res; s.onerror = () => rej(new Error("captain-mock.js did not load")); document.head.appendChild(s); })
      .catch(e => toast(e.message, "danger"));
  }
  const want = (location.hash || "").slice(1);

  go(view);
  await load();
  go(view);
  djPoll();
}
boot();

if (!MOCK && "serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
