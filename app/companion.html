<title>Jarvis</title>
<!--
  Living Desktop Companion — transparent 3D concept robot
  served from the local app server and hosted inside a frameless,
  transparent pywebview window.

  What the shipped character is:

  * The concept-board robot: a Hunyuan3D-generated, textured GLB (app/companion/models/robot/) skinned at load
    time by a runtime skeleton (app/companion/rigs/robot-rig.json, built by scripts/build_companion_rig.py),
    with eyelid and mouth overlay meshes for the face. If the model cannot load, the 2D concept sprite
    (fallback-robot.png) is shown instead.
  * Mouth motion follows actual playback amplitude (Python TTS output
    level for main speech; Web Audio AnalyserNode RMS for in-browser
    quips played through the shared <audio> element). It is NOT
    phoneme / viseme lip-sync — the spec explicitly asks that these
    two be distinguished.
  * Three.js is vendored under /vendor/three with its MIT LICENSE;
    this page never downloads a model or script from the internet.

  Architecture (one module per concern, each importable from Node tests
  that only need the pure JS logic):

    behavior.js      state resolver, idle picker, scheduler, mouth
                     stale timeout, event buffer, settings.
    glb-adapter.js   loads the GLB, skins it (robot-skin.js) and adds the face (glb-face.js).
    robot-skin.js    skeleton, skin weights and proxy-bone sync for the model.
    glb-face.js      eyelids (blink / narrowed eyes) and the amplitude-driven mouth.
    materials.js     live retinting from a profile.
    animation.js     bone-targeting clip registry + per-frame driver.
    voice-bridge.js  AnalyserNode wrapper for in-browser audio.
    profiles.js      adapter registry + hot-swap entry point.
-->

<style>

  /* ---- listening / thinking / speaking / result overlay, beside him (app/companion/overlay.js) ----
     The host grows his window to hold this box next to him (the same call his menu uses); nothing in it takes the
     mouse, so it is never in the hit mask and clicks pass through it to the desktop.
     Colour-key trap: the window blends every half-transparent pixel with its near-black key colour, not with the
     desktop. So the card's own outline is always fully opaque: it enters and leaves by a clip wipe, never by
     fading, and has no outer shadow or glow. Fades happen only INSIDE the card, over its solid background. */
  #overlay { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; visibility: hidden;

  .ov-arc { width: 30px; height: 30px; margin: -15px 0 0 -15px; border: 2px solid transparent; border-top-color: var(--accent);

  #overlay[data-phase="listening"] .ov-ring { border-color: var(--accent); opacity: .8; }

  #overlay[data-phase="thinking"] .ov-arc { opacity: 1; animation: ov-orbit 2000ms linear infinite; }

// Held by the cursor: arms up to the hand that holds him, legs dangling on a little pendulum driven by how the

  swingV += (heldDir * 0.7 - swing) * 0.16; swingV *= 0.9; swing += swingV;
  const wriggle = (Math.floor(now / 2400) % 3 === 0) ? Math.sin(now / 55) * 0.22 : 0;
  g.rotation.z = -swing * 0.45 + Math.sin(now / 260) * 0.04;

  ix.rest();
  const name = meta[0] && meta[0].name;
  lastDrop = { files: meta, saved: null, at: Date.now(), reaction: kind };
  noteRecent("dropped");
  if (name) speakBubble((DROP_LINES[kind] || "Caught {n}!").replace("{n}", name), { proactive: true });   // automatic: quiet at night
  const api = window.pywebview && window.pywebview.api;
  if (!api || (file && window.__jarvisFullPathDrops)) return;   // the host already has it, by its real path
  // read the first file and hand it to Jarvis (saved to data/dropped/)
  if (file && api.save_dropped_file) {
    try {
      const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
      const saved = await api.save_dropped_file(String(name).slice(0, 180), String(dataUrl).slice(0, 8_000_000));
      lastDrop.saved = saved || null;
    } catch (err) { console.warn("[companion] drop save failed:", err); }
  } else if (api.on_files_dropped) {
    try { await api.on_files_dropped(JSON.stringify(meta)); } catch {}
  }
}

// ---------------- Throw loop (Feature #154) ---------------- //
async function runThrow(vx, vy) {
  const api = window.pywebview && window.pywebview.api;
  if (!api || !api.companion_bounds || throwRunning) return;
  if (menu.isOpen) await menu.close();
  let bounds;
  try { bounds = await api.companion_bounds(window.screenX, window.screenY); } catch { return; }
  if (!bounds) return;
  throwRunning = true;
  ix.set("thrown");                                           // physics owns him until he has landed AND settled
  let st = launchState(window.screenX, window.screenY, vx, vy, THROW_PARAMS);
  const dir = vx >= 0 ? 1 : -1;
  let impact = 0;
  try {
    throwVisual = st; landSquash = 0;
    let last = performance.now();
    const raf = () => new Promise((r) => requestAnimationFrame(r));
    for (let guard = 0; guard < 1200 && !st.resting; guard++) {   // guard: never loop forever
      await raf();
      const now = performance.now();
      const dt = (now - last) / 1000; last = now;
      const wasAir = !st.onFloor, vyIn = st.vy;
      st = stepThrow(st, dt, bounds, THROW_PARAMS);
      if (st.onFloor && wasAir) impact = Math.max(impact, Math.abs(vyIn));
      if (st.onFloor && wasAir && Math.abs(st.vy) > 120) landSquash = Math.min(1, Math.abs(st.vy) / 1200);
      landSquash *= 0.82;
      throwVisual = st;
      try { await api.move_companion_fast(Math.round(st.x), Math.round(st.y)); } catch {}
    }
    await landingRecovery(st);
    throwVisual = null; throwRunning = false; landSquash = 0;
    const end = await landingReaction(st, impact, dir, bounds);   // superhero / faceplant / roll / cartwheel / jetpack...
    try { await api.companion_settled(end.x, end.y); } catch {}
  } finally {
    throwVisual = null; throwRunning = false; landSquash = 0; reactPose = null; reacting = false;
    ix.rest();                                                // releases "thrown" with a settle period before placement looks again
  }
}

// After a throw lands, a reaction with personality, picked by how hard he hit (interaction.landingKind).
const LAND_LINES = { faceplant: "Ow.", dizzy: "Whoa…", superhero: "Nailed it.", roll: "Tuck and roll!", cartwheel: "Ta-da!",
  annoyed: "Really, sir?", invite: "Again! Again!", surprised: "Oh!", popup: "Hup!", jetpack: "Thrusters online." };
const LAND_MS = { faceplant: 1500, superhero: 1200, roll: 1100, cartwheel: 1100, invite: 1700, surprised: 900, popup: 900,
  dizzy: 1300, annoyed: 1200, jetpack: 1400 };
async function landingReaction(st, impact = 0, dir = 1, bounds = null) {
  const api = API();
  let kind = landingKind(impact, st.bounces | 0);
  if (kind === "superhero" && Math.random() < 0.3) kind = "jetpack";   // now and then he catches himself on his jets
  lastLanding = { kind, impact: Math.round(impact), bounces: st.bounces | 0, at: Date.now() };
  if (kind === "faceplant" || kind === "annoyed") mood.nudge("annoyed", 0.4);
  else if (kind === "dizzy") mood.nudge("tired", 0.2);
  else { mood.nudge("proud", 0.25); mood.nudge("playful", 0.3); }
  noteRecent("landed");
  if (Math.random() < 0.7) speakBubble(LAND_LINES[kind], { proactive: true });                            // automatic: quiet at night
  reacting = true;
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const clampX = (x) => bounds ? Math.max(bounds.left, Math.min(bounds.right, x)) : x;
  const x0 = Math.round(st.x), y0 = Math.round(st.y), dur = LAND_MS[kind] || 1100, t0 = performance.now();
  let x = x0;
  for (;;) {
    await raf(); const t = (performance.now() - t0) / dur; if (t >= 1) break;
    reactPose = { phase: "land", kind, k: t, dir };
    let dx = 0, dy = 0;
    if (kind === "popup") dy = -Math.sin(Math.min(1, t * 1.6) * Math.PI) * 22;
    else if (kind === "jetpack") { dy = -Math.sin(Math.min(1, t * 1.1) * Math.PI) * 38; flashAccent(performance.now(), 1); }
    else if (kind === "roll") dx = dir * Math.min(1, t / 0.7) * 40;
    else if (kind === "cartwheel") { dx = dir * Math.min(1, t / 0.8) * 34; dy = -Math.abs(Math.sin(t * Math.PI)) * 10; }
    if (dx || dy) { x = Math.round(clampX(x0 + dx)); try { await api.move_companion_fast(x, Math.round(y0 + dy)); } catch {} }
  }
  reactPose = null; reacting = false;
  try { await api.move_companion_fast(x, y0); } catch {}
  return { x, y: y0 };
}

// ---------------- App-launch reaction (Feature #151): run up and kick ---------------- //
const easeInOut = (k) => k * k * (3 - 2 * k);

function applyReactPose(p, now) {
  _resetPose();
  const g = activeAdapter.group, b = activeAdapter.bones, s = p.dir || 1;
  if (p.phase === "run") {
    const cyc = Math.sin(now / 70);                          // fast leg pump
    g.rotation.z = -s * 0.12; g.position && (g.rotation.x = 0.1);
    if (b.hipL) b.hipL.rotation.x = cyc * 0.9;
    if (b.hipR) b.hipR.rotation.x = -cyc * 0.9;
    if (b.shoulderL) b.shoulderL.rotation.x = -cyc * 0.7;
    if (b.shoulderR) b.shoulderR.rotation.x = cyc * 0.7;
  } else if (p.phase === "kick") {
    const k = easeInOut(Math.min(1, p.k || 0));
    const leadHip = s > 0 ? b.hipR : b.hipL, leadKnee = s > 0 ? b.kneeR : b.kneeL;
    const kind = p.kind || "front";
    if (kind === "roundhouse") {                             // spinning horizontal kick
      g.rotation.z = -s * k * 1.4;                           // whole body spins into it
      if (leadHip) { leadHip.rotation.x = -0.6 * k; leadHip.rotation.z = -s * 1.2 * k; }
      if (leadKnee) leadKnee.rotation.x = 0.3 * (1 - k);
    } else if (kind === "flying") {                          // leg extended, airborne (window hops in runAppReact)
      g.rotation.z = -s * 0.25; g.rotation.x = -0.25;
      if (leadHip) leadHip.rotation.x = -1.7 * k;
      if (leadKnee) leadKnee.rotation.x = 0.15 * (1 - k);
      if (b.hipL && b.hipR) { (s > 0 ? b.hipL : b.hipR).rotation.x = 0.8; }   // trailing leg tucked
    } else if (kind === "slide") {                           // low sliding kick
      g.rotation.x = 0.55; g.position; g.scale.set(1.05, 0.8, 1);
      if (leadHip) leadHip.rotation.x = -1.8 * k;             // front leg stretched out low
      if (leadKnee) leadKnee.rotation.x = 0.1;
      if (b.hipL && b.hipR) (s > 0 ? b.hipL : b.hipR).rotation.x = 1.0;
    } else if (kind === "superhero") {                       // overhead smash coming down
      g.rotation.x = 0.1 - (1 - k) * 0.4;                     // tips from a rear wind-up into a downward strike
      if (leadHip) leadHip.rotation.x = -1.5 * k;
      if (b.shoulderL) b.shoulderL.rotation.x = -2.0 * (1 - k); if (b.shoulderR) b.shoulderR.rotation.x = -2.0 * (1 - k);
      flashAccent(now, k);
    } else if (kind === "backflip") {                        // full tumble into the kick
      g.rotation.z = -s * k * Math.PI * 2;
      if (leadHip) leadHip.rotation.x = -1.2 * k;
      if (b.hipL && b.hipR) (s > 0 ? b.hipL : b.hipR).rotation.x = 1.0;
    } else if (kind === "axe") {                             // leg raises overhead then chops down
      const up = Math.sin(Math.min(1, k) * Math.PI);
      if (leadHip) leadHip.rotation.x = -2.6 * up;            // very high, straight down
      if (leadKnee) leadKnee.rotation.x = 0.1;
      g.rotation.z = -s * 0.1;
    } else if (kind === "spinhook") {                        // half spin into a hooking heel
      g.rotation.z = -s * k * Math.PI;
      if (leadHip) { leadHip.rotation.x = -0.8 * k; leadHip.rotation.z = -s * 1.0 * k; }
      if (leadKnee) leadKnee.rotation.x = 0.8 * (1 - k);
    } else if (kind === "double") {                          // two rapid kicks
      const beat = Math.abs(Math.sin(k * Math.PI * 2));
      if (leadHip) leadHip.rotation.x = -1.4 * beat;
      if (leadKnee) leadKnee.rotation.x = 0.6 * (1 - beat);
      g.rotation.z = -s * 0.15;
    } else if (kind === "scorpion") {                        // bends forward, back leg kicks up behind
      g.rotation.x = 0.6;
      const back = s > 0 ? b.hipL : b.hipR;
      if (back) back.rotation.x = 1.8 * k;                    // trailing leg swings up behind
      if (b.shoulderL) b.shoulderL.rotation.x = -0.8; if (b.shoulderR) b.shoulderR.rotation.x = -0.8;
    } else {                                                 // front kick
      g.rotation.z = -s * (0.15 + k * 0.1);
      if (leadHip) leadHip.rotation.x = -1.4 * k;
      if (leadKnee) leadKnee.rotation.x = 0.6 * (1 - k);
    }
    if (b.shoulderL) b.shoulderL.rotation.z = -0.7;
    if (b.shoulderR) b.shoulderR.rotation.z = 0.7;
  } else if (p.phase === "impact") {
    g.scale.set(1.15, 0.9, 1.1);                             // brief squash on contact
    const leadHip = s > 0 ? b.hipR : b.hipL;
    if (leadHip) leadHip.rotation.x = -1.4;
    flashAccent(now);
  } else if (p.phase === "sit") {                            // comedy: landed on his bottom
    g.rotation.x = -0.5; g.position; g.rotation.z = p.wob ? Math.sin(now / 90) * 0.1 : 0;
    if (b.hipL) b.hipL.rotation.x = 1.2; if (b.hipR) b.hipR.rotation.x = 1.2;
    if (b.shoulderL) b.shoulderL.rotation.z = -1.0; if (b.shoulderR) b.shoulderR.rotation.z = 1.0;
  } else if (p.phase === "land") {                           // post-throw reaction
    if (p.kind === "dizzy") {                                // sits, head lolling in circles
      g.rotation.x = -0.4;
      if (b.head) { b.head.rotation.z = Math.sin(now / 130) * 0.4; b.head.rotation.y = Math.cos(now / 130) * 0.4; }
      if (b.hipL) b.hipL.rotation.x = 1.1; if (b.hipR) b.hipR.rotation.x = 1.1;
      if (b.shoulderL) b.shoulderL.rotation.z = -0.9; if (b.shoulderR) b.shoulderR.rotation.z = 0.9;
    } else if (p.kind === "annoyed") {                       // arms crossed, little shake, looks at the user
      g.rotation.z = Math.sin(now / 70) * 0.03;
      if (b.shoulderL) b.shoulderL.rotation.set(0.4, 0, -1.3); if (b.shoulderR) b.shoulderR.rotation.set(0.4, 0, 1.3);
      if (b.head) b.head.rotation.x = -0.12; p.sad = true;
    } else if (p.kind === "faceplant") {                     // face down on the floor, then pops up shaking his head
      const k = p.k || 0, down = k < 0.55 ? 1 : Math.max(0, 1 - (k - 0.55) / 0.25);
      g.rotation.x = 1.35 * down;
      if (b.shoulderL) b.shoulderL.rotation.set(-2.6 * down, 0, -0.4); if (b.shoulderR) b.shoulderR.rotation.set(-2.6 * down, 0, 0.4);
      if (b.head && k > 0.6) b.head.rotation.y = Math.sin(now / 60) * 0.35 * (1 - k);
      p.sad = k < 0.6;
    } else if (p.kind === "superhero" || p.kind === "jetpack") {   // three-point landing, then rises (jets: hovers back up)
      const k = p.k || 0, crouch = p.kind === "jetpack" ? 0.3 : Math.max(0, 1 - Math.max(0, k - 0.6) / 0.4);
      g.rotation.x = 0.25 * crouch;
      if (b.hipL) b.hipL.rotation.x = 1.0 * crouch; if (b.hipR) b.hipR.rotation.x = 0.4 * crouch;
      if (b.kneeL) b.kneeL.rotation.x = -1.2 * crouch; if (b.kneeR) b.kneeR.rotation.x = -1.4 * crouch;
      if (b.shoulderR) b.shoulderR.rotation.set(0.9 * crouch, 0, 0.3);          // fist to the floor
      if (b.shoulderL) b.shoulderL.rotation.set(-0.4 * crouch, 0, -1.2 * crouch);   // other arm swept back
      if (b.head) b.head.rotation.x = -0.25 * crouch;
      if (p.kind === "jetpack" && b.hipL && b.hipR) { b.hipL.rotation.x = -0.15; b.hipR.rotation.x = -0.15; }
    } else if (p.kind === "roll") {                          // tuck and roll forward, then up
      const k = p.k || 0, rolling = k < 0.7;
      g.rotation.z = rolling ? -(p.dir || 1) * (k / 0.7) * Math.PI * 2 : 0;
      if (rolling) { if (b.hipL) b.hipL.rotation.x = 1.4; if (b.hipR) b.hipR.rotation.x = 1.4;
        if (b.kneeL) b.kneeL.rotation.x = -1.5; if (b.kneeR) b.kneeR.rotation.x = -1.5;
        if (b.shoulderL) b.shoulderL.rotation.set(-1.2, 0, -0.3); if (b.shoulderR) b.shoulderR.rotation.set(-1.2, 0, 0.3); }
      else if (b.shoulderL && b.shoulderR) { b.shoulderL.rotation.z = -1.6; b.shoulderR.rotation.z = 1.6; }
    } else if (p.kind === "cartwheel") {                     // arms and legs out, wheeling sideways
      const k = p.k || 0;
      g.rotation.z = -(p.dir || 1) * Math.min(1, k / 0.8) * Math.PI * 2;
      if (b.shoulderL) b.shoulderL.rotation.z = -2.5; if (b.shoulderR) b.shoulderR.rotation.z = 2.5;
      if (b.hipL) b.hipL.rotation.z = -0.6; if (b.hipR) b.hipR.rotation.z = 0.6;
    } else if (p.kind === "invite") {                        // "again!": bouncing, beckoning with one hand
      g.rotation.z = Math.sin(now / 120) * 0.05;
      if (b.shoulderR) b.shoulderR.rotation.set(-1.3, 0, 0.5);
      if (b.elbowR) b.elbowR.rotation.x = -0.6 + Math.sin(now / 110) * 0.6;
      if (b.head) b.head.rotation.z = 0.12;
      flashAccent(now, 0.4);
    } else if (p.kind === "surprised") {                     // arms flung up, head back
      if (b.shoulderL) b.shoulderL.rotation.z = -2.1; if (b.shoulderR) b.shoulderR.rotation.z = 2.1;
      if (b.head) b.head.rotation.x = -0.3;
      g.scale.set(0.97, 1.05, 1);
    } else {                                                 // popup: arms up, happy (window hops in landingReaction)
      if (b.shoulderL) b.shoulderL.rotation.z = -2.0; if (b.shoulderR) b.shoulderR.rotation.z = 2.0;
      flashAccent(now, 0.6);
    }
  } else if (p.phase === "brace") {                          // drag hovering over him: ready to catch
    g.rotation.x = 0.08;
    if (b.shoulderL) b.shoulderL.rotation.set(-1.0, 0, -0.45);
    if (b.shoulderR) b.shoulderR.rotation.set(-1.0, 0, 0.45);
    if (b.head) b.head.rotation.x = -0.12;
  } else if (p.phase === "catch" || (p.phase === "drop" && p.kind === "catch")) {   // file dropped: grab it, little recoil
    const k = Math.sin(Math.min(1, p.k || 0) * Math.PI);
    g.scale.set(1 - 0.08 * k, 1 + 0.08 * k, 1);
    if (b.shoulderL) b.shoulderL.rotation.set(-1.5 + k * 0.4, 0, -0.75);
    if (b.shoulderR) b.shoulderR.rotation.set(-1.5 + k * 0.4, 0, 0.75);
    flashAccent(now, 0.5);
  } else if (p.phase === "drop") {                           // the other ways he receives a dropped file
    const k = Math.min(1, p.k || 0), s = p.dir || 1;
    if (p.kind === "juggle") {                               // hands bouncing up and down in turn
      const q = Math.sin(now / 95);
      if (b.shoulderL) b.shoulderL.rotation.set(-1.4 - q * 0.35, 0, -0.5);
      if (b.shoulderR) b.shoulderR.rotation.set(-1.4 + q * 0.35, 0, 0.5);
      if (b.head) b.head.rotation.x = -0.25 + Math.abs(q) * 0.1;
    } else if (p.kind === "swing") {                         // a cartoon baseball swing
      const sw = k < 0.4 ? -k / 0.4 : Math.min(1, (k - 0.4) / 0.2);
      g.rotation.y = sw * 1.1;
      if (b.shoulderL) b.shoulderL.rotation.set(-1.2, 0, -0.9 + sw * 0.9); if (b.shoulderR) b.shoulderR.rotation.set(-1.2, 0, 0.9 + sw * 0.4);
      if (k > 0.6) flashAccent(now, 1);
    } else if (p.kind === "toss" || p.kind === "finisher") {  // throws it up and catches it / spins into a pose
      const up = Math.sin(k * Math.PI);
      if (b.shoulderL) b.shoulderL.rotation.z = -1.0 - up * 1.2; if (b.shoulderR) b.shoulderR.rotation.z = 1.0 + up * 1.2;
      if (p.kind === "finisher") { g.rotation.y = k * Math.PI * 2; if (k > 0.8) flashAccent(now, 1); }
      if (b.head) b.head.rotation.x = -0.35 * up;
    } else if (p.kind === "miss") {                          // it sails past: looks left, right, then grabs it
      if (b.head) b.head.rotation.y = k < 0.7 ? Math.sin(now / 160) * 0.6 : 0;
      if (k >= 0.7 && b.shoulderL && b.shoulderR) { b.shoulderL.rotation.set(-1.5, 0, -0.75); b.shoulderR.rotation.set(-1.5, 0, 0.75); }
    } else if (p.kind === "struggle") {                      // a heavy file: knees buckle, arms straining
      g.rotation.z = Math.sin(now / 50) * 0.04; g.scale.set(1.04, 0.95, 1);
      if (b.shoulderL) b.shoulderL.rotation.z = -2.2; if (b.shoulderR) b.shoulderR.rotation.z = 2.2;
      if (b.hipL) b.hipL.rotation.x = 0.5; if (b.hipR) b.hipR.rotation.x = 0.5;
      if (b.kneeL) b.kneeL.rotation.x = -0.9; if (b.kneeR) b.kneeR.rotation.x = -0.9;
      p.sad = true;
    } else if (p.kind === "portal") {                        // hands out, a glowing portal swallows it
      if (b.shoulderL) b.shoulderL.rotation.set(-1.4, 0, -0.3); if (b.shoulderR) b.shoulderR.rotation.set(-1.4, 0, 0.3);
      g.rotation.y = Math.sin(now / 200) * 0.2;
      flashAccent(now, 1);
    } else if (p.kind === "kick") {                          // a shortcut gets kicked open
      const leadHip = s > 0 ? b.hipR : b.hipL;
      if (leadHip) leadHip.rotation.x = -1.5 * Math.sin(Math.min(1, k * 1.5) * Math.PI);
      if (b.shoulderL) b.shoulderL.rotation.z = -0.7; if (b.shoulderR) b.shoulderR.rotation.z = 0.7;
    }
  } else if (p.phase === "settle") {                         // feet back on the ground after being held
    const k = Math.sin(Math.min(1, p.k || 0) * Math.PI);
    g.scale.set(1 + 0.08 * k, 1 - 0.08 * k, 1);
  } else if (p.phase === "examine") {                        // running a skill: leans in, studying the screen
    g.rotation.x = 0.08;
    if (b.head) { b.head.rotation.x = 0.12; b.head.rotation.y = (p.dir || 1) * 0.35 + Math.sin(now / 700) * 0.12; }
    if (b.shoulderR) b.shoulderR.rotation.z = 0.95; if (b.elbowR) b.elbowR.rotation.x = -1.45;   // hand to chin
    flashAccent(now, 0.35);
  } else if (p.phase === "teleport") {                       // folding into light, then back out
    const s2 = Math.max(0.05, Math.abs(1 - 2 * Math.min(1, p.k || 0)));
    g.scale.set(s2, 1 / Math.max(0.3, s2) * 0.6 + 0.4, s2);
    flashAccent(now, 1);
  } else if (p.phase === "play") {                           // batting a little toy ball
    const bx = p.bx || 0;
    if (b.head) { b.head.rotation.x = 0.3; b.head.rotation.y = bx * 4; }   // look down and toward the ball
    g.rotation.z = -bx * 1.5;
    if (p.kick) {                                            // a little kick toward the ball
      const leadHip = bx < 0 ? b.hipL : b.hipR;
      if (leadHip) leadHip.rotation.x = -1.0;
    }
  } else if (p.phase === "cheer") {                          // game win: arms up, bouncing
    const q = Math.sin(now / 90);
    g.rotation.z = q * 0.08;
    if (b.shoulderL) b.shoulderL.rotation.z = -2.2 + q * 0.2;   // both arms raised
    if (b.shoulderR) b.shoulderR.rotation.z = 2.2 - q * 0.2;
    if (b.head) b.head.rotation.x = -0.15;
    flashAccent(now, 0.8);
  } else if (p.phase === "charge") {                         // comedy: power-up
    const q = Math.sin(now / 40) * (p.k || 0);
    g.scale.set(1 + 0.05 * (p.k || 0), 1 + 0.08 * (p.k || 0), 1);
    g.rotation.z = q * 0.05;
    if (b.shoulderL) b.shoulderL.rotation.z = -0.5; if (b.shoulderR) b.shoulderR.rotation.z = 0.5;
    flashAccent(now, p.k || 0);
  }
  activeAdapter.sync?.();
}

// Pulse the glow materials brighter for an "impact / power-up" flash (unlit glow slots).
function flashAccent(now, boost = 1) {
  const mats = activeAdapter.materials || {};
  for (const key of ["accentPrimary", "chestCore", "eyeGlow", "footGlow"]) {
    const m = mats[key];
    if (m && m.userData && m.userData.unlitGlow) {
      const base = m.userData.glowHex, k = Math.min(1, (m.userData.glowIntensity || 1));
      const pulse = 1 + 0.6 * boost * Math.abs(Math.sin(now / 60));
      m.color.setHex(base).multiplyScalar(Math.min(1, k) * pulse > 1 ? 1 : Math.min(1, k) * pulse);
    }
  }
}

/** Run over to a newly launched window and kick it. target = a point on the new window. */
async function runAppReact(tx, ty, opts = {}) {
  const api = window.pywebview && window.pywebview.api;
  if (!api || !api.move_companion_fast || throwRunning || held || reacting || ix.owning || menu.isOpen) return;
  ix.set("repositioning");                                   // the kick run owns his position (lease) until he's done
  try { await runAppReactInner(api, tx, ty, opts); } finally { reacting = false; reactPose = null; ix.rest(); }
}
async function runAppReactInner(api, tx, ty, opts) {
  reacting = true;
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const w = window.innerWidth, h = window.innerHeight;
  const startX = window.screenX, startY = window.screenY;
  let b = null;
  try { b = await api.companion_bounds(startX, startY); } catch {}
  const clampX = (x) => b ? Math.max(b.left, Math.min(b.right, x)) : x;
  const clampY = (y) => b ? Math.max(b.top, Math.min(b.bottom, y)) : y;
  // stand just beside the target, on whichever side he's already on
  const fromLeft = startX <= tx;
  const standX = clampX(fromLeft ? tx - w - 16 : tx + 16);
  const standY = clampY(ty - h / 2);
  const dir = standX <= tx ? 1 : -1;                         // face toward the window

  if (opts.comedy) {
    mood.nudge("annoyed", 0.7);                                // a whiffed kick is extra annoying
    await runFailedKick(startX, startY, standX, standY, dir, clampX, clampY); reacting = false; return;
  }
  mood.nudge("annoyed", 0.4); mood.nudge("proud", 0.2);        // kicking an intruding window: annoyed, a touch smug

  const KICKS = ["front", "roundhouse", "flying", "slide", "superhero", "backflip", "axe", "spinhook", "double", "scorpion"];
  const kind = opts.kind && KICKS.includes(opts.kind) ? opts.kind : KICKS[Math.floor(Math.random() * KICKS.length)];

  // run
  let t0 = performance.now(); const runMs = 650;
  for (;;) {
    await raf(); const k = Math.min(1, (performance.now() - t0) / runMs);
    reactPose = { phase: "run", dir };
    try { await api.move_companion_fast(Math.round(startX + (standX - startX) * easeInOut(k)),
                                        Math.round(startY + (standY - startY) * easeInOut(k))); } catch {}
    if (k >= 1) break;
  }
  // wind up + kick (a flying kick hops up and forward; a slide/front stay grounded)
  t0 = performance.now(); const kickMs = 340;
  for (;;) {
    await raf(); const k = Math.min(1, (performance.now() - t0) / kickMs);
    reactPose = { phase: "kick", dir, k, kind };
    if (kind === "flying") {
      const hop = Math.sin(k * Math.PI) * 34;                 // arc up then down during the kick
      try { await api.move_companion_fast(standX + Math.round(dir * k * 10), Math.round(clampY(standY - hop))); } catch {}
    } else if (kind === "superhero" || kind === "backflip") {
      const hop = Math.sin(k * Math.PI) * 46;                 // a big leap
      try { await api.move_companion_fast(standX, Math.round(clampY(standY - hop))); } catch {}
    } else if (kind === "slide") {
      try { await api.move_companion_fast(Math.round(standX + dir * k * 22), standY); } catch {}   // slides into it
    }
    if (k >= 1) break;
  }
  reactPose = { phase: "impact", dir, kind };
  try { await api.move_companion_fast(standX, standY); } catch {}
  await raf(); await new Promise((r) => setTimeout(r, 160));
  reactPose = null; reacting = false;
  try { await api.companion_settled(standX, standY); } catch {}
}

// Feature #151 comedy: confident run, failed kick, bounce onto his bottom, sulk, power up, revenge kick, victory.
async function runFailedKick(startX, startY, standX, standY, dir, clampX, clampY) {
  const api = window.pywebview && window.pywebview.api;
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const moveTo = async (x, y) => { try { await api.move_companion_fast(Math.round(x), Math.round(y)); } catch {} };
  const hold = async (ms, pose) => { const t0 = performance.now(); while (performance.now() - t0 < ms) { await raf(); reactPose = typeof pose === "function" ? pose((performance.now() - t0) / ms) : pose; } };
  // 1. confidence (stretch at the start)
  await hold(500, { phase: "charge", dir, k: 0.3 });
  // 2. run in
  let t0 = performance.now(); const runMs = 520;
  for (;;) { await raf(); const k = Math.min(1, (performance.now() - t0) / runMs);
    reactPose = { phase: "run", dir };
    await moveTo(startX + (standX - startX) * easeInOut(k), startY + (standY - startY) * easeInOut(k));
    if (k >= 1) break; }
  // 3. kick... and bounce back
  await hold(220, (k) => ({ phase: "kick", dir, k }));
  const backX = clampX(standX - dir * 180), backY = clampY(standY + 40);
  t0 = performance.now(); const backMs = 360;
  for (;;) { await raf(); const k = Math.min(1, (performance.now() - t0) / backMs);
    reactPose = { phase: "sit", dir, wob: false };
    await moveTo(standX + (backX - standX) * k, standY + (backY - standY) * Math.sin(k * Math.PI)); // little arc
    if (k >= 1) break; }
  // 4. sulk on his bottom
  await hold(900, { phase: "sit", dir, wob: true, sad: true });
  // 5. power up
  await hold(1100, (k) => ({ phase: "charge", dir, k }));
  // 6. revenge sprint + big kick
  t0 = performance.now(); const sprintMs = 360;
  for (;;) { await raf(); const k = Math.min(1, (performance.now() - t0) / sprintMs);
    reactPose = { phase: "run", dir };
    await moveTo(backX + (standX - backX) * easeInOut(k), backY + (standY - backY) * easeInOut(k));
    if (k >= 1) break; }
  await hold(260, (k) => ({ phase: "kick", dir, k }));
  reactPose = { phase: "impact", dir };
  await raf(); await new Promise((r) => setTimeout(r, 180));
  // 7. victory
  await hold(600, { phase: "charge", dir, k: 0.5 });
  reactPose = null;
  try { await api.companion_settled(standX, standY); } catch {}
}

// Miniature life: a little toy ball drops in and he bats it around for a few seconds, then it's gone.
function ensureBall() {

  const mat = new threeNS.MeshStandardMaterial({ color: 0x00e5ff, metalness: 0.2, roughness: 0.3, emissive: 0x00334d });

async function runPlay() {
  ensureBall();
  if (!playBall || playing || wandering || flying || perching || throwRunning || held || reacting) return;
  playing = true; playBall.visible = true;
  const raf = () => new Promise((r) => requestAnimationFrame(r));

    const bounce = Math.abs(Math.sin(e / 260)) * 0.07;       // the ball bounces

    playBall.position.set(bx, bounce, 0.055);

// Glide the window from its current spot to (tx, ty) over `ms`, arcing up by `arc` px mid-flight.
async function glide(tx, ty, ms, arc = 0, keepGoing = () => true) {
  const api = window.pywebview && window.pywebview.api;
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const sx = window.screenX, sy = window.screenY, t0 = performance.now();
  for (;;) {
    await raf();
    if (!keepGoing()) return false;
    const k = Math.min(1, (performance.now() - t0) / ms);
    const x = Math.round(sx + (tx - sx) * k), y = Math.round(sy + (ty - sy) * k - Math.sin(k * Math.PI) * arc);
    try { await api.move_companion_fast(x, y); } catch {}
    if (k >= 1) return true;
  }
}

// ---------------- Relocation (Living Presence) ---------------- //
// The host's placement engine (core/presence.plan_placement) decided he's in the way and where to go; he travels
// there in character — a calm walk, hops, a jet-assisted flight or a teleport — holding the "repositioning" lease
// so no other movement competes. Refused while anything else owns him; the host simply asks again later.
const FOCUSED = new Set(["coding", "typing", "reading", "video", "meeting"]);
const animateFor = async (ms, fn) => {
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const t0 = performance.now();
  for (;;) { await raf(); const k = Math.min(1, (performance.now() - t0) / ms); fn(k); if (k >= 1) break; }
};
async function runRelocate(msg) {
  const a = API();
  if (!a || !a.move_companion_fast || throwRunning || held || reacting || ix.owning || menu.isOpen
      || wandering || flying || parkouring || perching || playing) return false;
  ix.set("repositioning");
  try {
    const sx = window.screenX, sy = window.screenY, tx = msg.x | 0, ty = msg.y | 0;
    const style = companion.reducedMotion ? "teleport" : (msg.style || "walk");
    const plan = travelPlan(style, Math.hypot(tx - sx, ty - sy));
    if (plan.fade) {
      await animateFor(plan.ms / 2, (k) => { reactPose = { phase: "teleport", k: k / 2 }; });
      try { await a.move_companion_fast(tx, ty); } catch {}
      await animateFor(plan.ms / 2, (k) => { reactPose = { phase: "teleport", k: 0.5 + k / 2 }; });
      reactPose = null;
    } else {
      if (style === "fly") flying = true; else if (style === "hop") parkouring = true; else wandering = true;
      const pulse = style === "fly" ? setInterval(() => flashAccent(performance.now(), 0.8), 60) : 0;
      try { if(!await glide(tx, ty, plan.ms, plan.arc,()=>!ix.is("suspended")&&!held)) return false; }
      finally { clearInterval(pulse); flying = false; parkouring = false; wandering = false; }
    }
    await applyDock(msg.dock | 0);
    try { await a.companion_settled(window.screenX, window.screenY); } catch {}
    return true;
  } finally {
    reactPose = null;
    ix.rest();
  }
}

// Crowded desktop: dock 1 = a smaller, translucent version of him; 2 = also tucked mostly past the screen edge
// (the host chose that spot). Dock 0 restores his saved size and full opacity.
async function applyDock(level) {
  const a = API();
  if (level === dockLevel) return;
  dockLevel = level;
  try {
    if (a && a.companion_alpha) await a.companion_alpha(level ? 0.6 : 1.0);
    const base = companion.settings.character_px;
    if (a && a.set_character_size) await a.set_character_size(level ? Math.max(50, Math.round(base * 0.7)) : base, false);
  } catch {}
  maskSent = "";
  ix.setBase(level ? "docked" : (FOCUSED.has(userActivity) ? "work_focus" : "ambient"));
}

// What the user is doing (pushed by the host when it changes): calm and in place while they work.
function setActivity(value) {
  userActivity = value;
  if (dockLevel) return;
  ix.setBase(FOCUSED.has(value) && companion.settings.work_aware !== false ? "work_focus" : "ambient");
  if (FOCUSED.has(value) && companion.settings.work_aware !== false) {
    wandering = false; perching = false;                      // finish any stroll now: don't walk across their work
    if (currentIdle && MOVING.has(currentIdle)) currentIdle = null;
  }
}

// Fly: rise up, glide across the desktop with a jetpack glow, then descend and return home.
async function runFly(requested=false) {
  const api = window.pywebview && window.pywebview.api;
  if (!api || !api.move_companion_fast || companion.reducedMotion || (!requested && !isAmbient(companion.mode)) || parkouring || playing || flying || wandering || perching || throwRunning || held || reacting) return;
  flying = true; dozing = false;

  const home = window.screenX, y0 = window.screenY;
  let b = null; try { b = await api.companion_bounds(home, y0); } catch {}
  const clampX = (x) => b ? Math.max(b.left, Math.min(b.right, x)) : x;
  const clampY = (y) => b ? Math.max(b.top, Math.min(b.bottom, y)) : y;
  const dir = (b && home - b.left > b.right - home) ? -1 : 1;

    && !companion.reducedMotion && !ix.is("suspended");
  try {

// Parkour: a run of tucked hops across the desktop and back.
async function runParkour() {
  const api = window.pywebview && window.pywebview.api;
  if (!api || !api.move_companion_fast || parkouring || flying || wandering || perching || throwRunning || held || reacting) return;
  parkouring = true;

  for (let i = 0; i < 3; i++) { const nx = clampX(x - dir * 90); await glide(nx, y0, 450, 55); x = nx; await new Promise((r) => setTimeout(r, 120)); }

// Notice the cursor and wander partway toward it to investigate, then amble home (curiosity).
async function runCurious() {
  const api = window.pywebview && window.pywebview.api;
  if (!api || !api.move_companion_fast || !api.cursor_pos || wandering || perching || throwRunning || held || reacting) return;
  let c = null; try { c = await api.cursor_pos(); } catch {}
  if (!c) return;
  const y0 = window.screenY, home = window.screenX, myX = home + window.innerWidth / 2;
  if (Math.abs(c[0] - myX) < 130) return;                      // already near the cursor — nothing to investigate
  let b = null; try { b = await api.companion_bounds(home, y0); } catch {}
  const clampX = (x) => b ? Math.max(b.left, Math.min(b.right, x)) : x;
  const dir = c[0] > myX ? 1 : -1;
  const target = clampX(home + dir * Math.min(170, Math.abs(c[0] - myX) - 70));
  wandering = true;
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const walkTo = async (tx) => { const sx = window.screenX, t0 = performance.now(), ms = 900;
    for (;;) { await raf(); const k = Math.min(1, (performance.now() - t0) / ms);
      try { await api.move_companion_fast(Math.round(sx + (tx - sx) * k), y0); } catch {} if (k >= 1 || !wandering) break; } };
  await walkTo(target);
  const t0 = performance.now();                                // pause and peer at the cursor
  while (performance.now() - t0 < 1200 && wandering) { currentIdle = "look_around"; await raf(); }
  if (wandering) await walkTo(home);
  wandering = false;
  try { await api.companion_settled(window.screenX, y0); } catch {}
}

// Climb to the nearest left/right screen edge, perch and sit there a while, then amble back home.
async function runPerch() {
  const api = window.pywebview && window.pywebview.api;
  if (!api || !api.move_companion_fast || wandering || perching || throwRunning || held || reacting) return;
  wandering = true;
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const y0 = window.screenY, home = window.screenX;
  let b = null; try { b = await api.companion_bounds(home, y0); } catch {}
  if (!b) { wandering = false; return; }
  const edge = (home - b.left) < (b.right - home) ? b.left : b.right;   // nearer side
  const walkTo = async (tx) => {
    const sx = window.screenX, t0 = performance.now(), ms = 1100;
    for (;;) { await raf(); const k = Math.min(1, (performance.now() - t0) / ms);
      try { await api.move_companion_fast(Math.round(sx + (tx - sx) * k), y0); } catch {}
      if (k >= 1 || (!wandering && !perching)) break; }
  };
  await walkTo(edge);                                          // walk to the edge
  if (wandering) {                                             // (the cursor coming to him stops the stroll)
    perching = true;                                           // sit perched for a few seconds
    const t0 = performance.now();
    while (performance.now() - t0 < 3500 && perching) await raf();
    if (perching) { perching = false; await walkTo(home); }    // amble home
    perching = false;
  }
  wandering = false;
  try { await api.companion_settled(window.screenX, y0); } catch {}
}

// A victory hop (3 little jumps, arms up) — the panel calls this when you win a game (Feature #153).
async function runCelebrate() {
  const api = window.pywebview && window.pywebview.api;
  if (!api || !api.move_companion_fast || throwRunning || held || reacting) return;
  mood.nudge("proud", 0.8); mood.nudge("happy", 0.4);   // a win makes him proud + happy
  reacting = true;
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const x0 = window.screenX, y0 = window.screenY;
  let b = null; try { b = await api.companion_bounds(x0, y0); } catch {}

// Ease the tumble angle upright with a final squash, so he "lands" rather than freezing mid-spin.
async function landingRecovery(st) {
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const a0 = ((st.angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  const target = a0 > Math.PI ? Math.PI * 2 : 0;         // nearest upright
  landSquash = Math.max(landSquash, 0.6);
  for (let i = 0; i <= 14; i++) {
    const k = i / 14;
    st = { ...st, angle: a0 + (target - a0) * (k * k * (3 - 2 * k)) };
    landSquash *= 0.8;
    throwVisual = st;
    await raf();
  }
}

// ---------------- Voice bridge: Web Audio quip -> level ---------------- //
function initVoiceBridge() {
  // The AmplitudeMeter needs a user-gesture-activated AudioContext on some
  // browsers; it auto-resumes on `play`. ``onLevel`` enqueues the same
  // {type:'level'} events the Python side sends via /control.
  meter = new AmplitudeMeter(quipEl, {
    onLevel: (v) => incoming.put({ type: "level", value: v, source: "companion-quip" }),
    onEnd:   ()  => incoming.put({ type: "level", value: 0, source: "companion-quip" }),
    gain: 2.4,
  });
  meter.attach();
  // Panel-played quips arrive through the standard HUD queue as
  // {type:"level", source:"panel-quip"} — hud/index.html posts them via
  // Api.companion_level, which core/hud.level() arbitrates and routes.
  // No cross-origin BroadcastChannel is involved.
}

/** Public: speak via the local server and drive the mouth with real
 *  AnalyserNode amplitude. Not used by the Python state producer (which
 *  pushes `level` events directly); invoked by any in-browser quip code. */
window.companionSay = async function companionSay(text) {
  return localSpeech.speak(String(text || "").slice(0,400));
};

  else if(r) speakBubble(r.reason);

function scheduleScene(action) {
  sceneQueue=sceneQueue.catch(()=>{}).then(action);

}

async function _openHome(patch=null) {
  if(!homeScene || !API()?.companion_scene) return false;
  if(menu.isOpen) await menu.close();
  if(roomOpen) {await loadHome();if(patch)await changeHome(patch);dozing=false;ix.set("playing");fitCameraToRig();return true;}
  await _closeScene(); leaveSurface(); await loadHome();
  if(patch) await changeHome(patch);
  document.documentElement.classList.add("scene-open");document.getElementById("scene-label").textContent="Home / Room";
  roomOpen=true;dozing=false;homeScene.group.visible=true;ix.set("playing");
  if(await API().companion_scene("home",window.devicePixelRatio||1) === false) {await _closeScene();return false;}
  resize();fitCameraToRig();return true;
}
async function _closeScene() {
  if(menu.isOpen && (roomOpen||directOpen||performanceOpen)) await menu.close();
  if(!roomOpen && !directOpen && !performanceOpen) return;
  document.documentElement.classList.remove("scene-open");stageEl.classList.remove("playground");
  document.getElementById("scene-clear").style.display="none";
  roomOpen=false;directOpen=false;performanceOpen=false;directPointer=null;drawPointer=false;
  if(performances?.snapshot().name === "draw") await saveDrawing();
  performances?.stop();setRobotOpacity(1);
  if(homeScene) homeScene.group.visible=false;
  directPlay?.stop();
  if(robotMount) {robotMount.position.set(0,0,0);robotMount.rotation.set(0,0,0);robotMount.scale.setScalar(1);}
  await API()?.companion_scene?.("");ix.rest();resize();fitCameraToRig();
}
async function _openDirect(kind) {

  if(menu.isOpen) await menu.close();
  await _closeScene();leaveSurface();directPlay.start(kind);directOpen=true;
  document.documentElement.classList.add("scene-open");stageEl.classList.add("playground");document.getElementById("scene-label").textContent="Drag to throw a ball · "+kind;dozing=false;ix.set("playing");
  if(await API().companion_scene("play",window.devicePixelRatio||1) === false) {await _closeScene();return false;}
  resize();fitCameraToRig();

}
function setRobotOpacity(value) {
  if(!activeAdapter) return;
  activeAdapter.group.traverse(o=>{
    for(const m of (Array.isArray(o.material)?o.material:o.material?[o.material]:[])) {
      if(!robotOpacity.has(m)) robotOpacity.set(m,{opacity:m.opacity,transparent:m.transparent});
      const original=robotOpacity.get(m);m.opacity=original.opacity*value;m.transparent=value<1||original.transparent;
    }
  });
}
async function _startPerformance(name) {

function scenePoint(e,z) {
  const r=stageEl.getBoundingClientRect();
  const ray=new threeNS.Vector3((e.clientX-r.left)/r.width*2-1,1-(e.clientY-r.top)/r.height*2,.5).unproject(camera).sub(camera.position).normalize();
  const t=(z-camera.position.z)/ray.z;
  return t>=0?camera.position.clone().addScaledVector(ray,t):null;
}
function addDrawingPoint(e) {
  const r=stageEl.getBoundingClientRect();
  const v=new threeNS.Vector3((e.clientX-r.left)/r.width*2-1,1-(e.clientY-r.top)/r.height*2,.5).unproject(camera);
  const ray=v.sub(camera.position).normalize(), t=(.30*.145-camera.position.z)/ray.z;
  if(t<0) return;
  const p=camera.position.clone().addScaledVector(ray,t),x=(p.x/.30-.3)/.7,y=(p.y/.30-.34)/.62;
  if(x>=0&&x<=1&&y>=0&&y<=1) performances?.addPoint(x,y);
}

async function lifeEvent(kind="", action=null, surface_id=null) {
  const r=await API()?.companion_life?.(kind,action,surface_id);
  if(!r?.ok) return r;
  lifeInfo=r;
  if(r.mood && MOODS.includes(r.mood)) mood.nudge(r.mood,.2);
  if(r.new_unlocks?.length) {
    await loadHome();const owned=new Map(homeState.inventory.map(i=>[i.id,i]));
    for(const item of r.new_unlocks) owned.set(item.id,item);
    await changeHome({inventory:[...owned.values()].slice(-12)});
  }
  return r;
}
function lifeBias(name) {
  const s=lifeInfo?.snapshot;if(!s) return 1;
  const now=Date.now()/1000,c=s.last_correction;
  if(c && !c.action && !c.surface_id && now-c.at<86400 && IDLE[name]?.big) return 0;
  const p=s.actions[name];
  if(p?.last_correction && now-p.last_correction<86400) return 0;
  return p?(1+Math.min(10,p.good)/10)/(1+p.corrections*2):1;
}

// Positioning the two boxes the host laid out (core/presence.expand_layout, CSS px): his stage keeps its size and
// screen spot, the menu sits beside him. null = collapsed (the window is just him again).
const menuEl = document.getElementById("menu");
function applyLayout(lay) {
  if (!lay) {
    stageEl.removeAttribute("style");
    menuEl.style.left = menuEl.style.top = menuEl.style.width = menuEl.style.height = "";
  } else {
    const [rx, ry, rw, rh] = lay.robot, [px, py, pw, ph] = lay.panel;
    Object.assign(stageEl.style, { left: rx + "px", top: ry + "px", width: rw + "px", height: rh + "px" });
    Object.assign(menuEl.style, { left: px + "px", top: py + "px", width: pw + "px", height: ph + "px" });
  }

  if(lay) Object.assign(toolbar.style,{left:(lay.robot[0]+6)+"px",top:(lay.robot[1]+6)+"px",width:Math.max(0,lay.robot[2]-24)+"px",right:"auto"});
  else toolbar.removeAttribute("style");
  resize(); fitCameraToRig();
}

async function apiCall(method, path, body) {
  const a = API();
  if (!a || !a.call) return { ok: false, data: { detail: "Jarvis's server isn't connected." } };
  try { return await a.call(method, path, body ?? null); } catch (e) { return { ok: false, data: { detail: String(e) } }; }
}

// Play a reply from the server in his voice: the shared <audio> element drives his mouth (AmplitudeMeter), the
// words drive the viseme shapes.
async function sayAudio(url, text, token = undefined) {
  if (token !== undefined && !localSpeech.current(token)) return false;
  if (!url) { if (token !== undefined) localSpeech.finish(token); return false; }
  if (text) { visemeTimeline=textToVisemes(text); visemeStart=performance.now(); }
  return localSpeech.play(url, token);
}

      catch { r = { ok: false, data: { detail: "The skill request failed." } }; }

  if(action==="home") return openHome();

// ---------------- The overlay card beside him: listening / thinking / speaking / result ---------------- //
// overlay.js decides WHAT to show; this draws it. The host grows his window to hold a box beside him (the call his
// menu uses) and the card sits in it. It never takes the mouse: the box is not in the hit mask (panelHit is the
// menu's alone), so clicks pass through it to the desktop. It steps aside for his menu, his room and while he moves.
const overlayEl = document.getElementById("overlay");
const ov = { card: overlayEl.querySelector(".ov-card"), orb: overlayEl.querySelector(".ov-orb"), label: overlayEl.querySelector(".ov-label"),
  chip: overlayEl.querySelector(".ov-chip"), text: overlayEl.querySelector(".ov-text"), lines: overlayEl.querySelector(".ov-lines"),
  hint: overlayEl.querySelector(".ov-hint") };
const OV_CARD = { cardW: 372, cardH: 108, gap: 10 };
const OV_HINTS = { listening: "Go ahead, sir.", thinking: "One moment…", error: "I could not complete that, sir." };
let ovPlaced = false, ovBusy = false, ovHost = false, ovSeq = -1, ovCount = -1, ovShown = -1, ovKind = "", ovLevel = -1, ovChip = "", ovDrawn = "";
const ovSleep = (ms) => new Promise((r) => setTimeout(r, ms));
function overlayAllowed() {
  return !menu.isOpen && !roomOpen && !directOpen && !performanceOpen && !held && !throwRunning && !reacting
    && !wandering && !perching && !flying && !parkouring && !gesture.active && document.body.style.visibility !== "hidden";
}
async function placeOverlay() {
  ovBusy = true;
  try {
    const r = stageEl.getBoundingClientRect();
    const box = overlayBox(r.height, OV_CARD);
    const a = API();
    let lay = null;
    if (a && a.companion_expand) { try { lay = await a.companion_expand(box.boxW, box.boxH, "", window.devicePixelRatio || 1, "overlay"); } catch {} }
    if (!overlayAllowed()) {                                // his menu (or a drag) began while the host answered
      if (lay && !menu.isOpen) { let mine = false; try { mine = await a.companion_collapse("overlay"); } catch {} if (mine && !menu.isOpen) applyLayout(null); }
      return;
    }
    let left, top, side;
    if (lay) {
      ovHost = true; applyLayout(lay);
      const [px, py, pw, ph] = lay.panel;
      side = lay.side === "left" ? "left" : "right";
      left = px + (side === "right" ? pw - box.cardW : 0); top = py + Math.max(0, ph - box.boxH) + box.cardTop;
    } else {                                                // no host (a browser, the lab): beside him in the page
      ovHost = false;
      side = r.right + box.gap + box.cardW <= window.innerWidth || r.left < box.cardW + box.gap ? "right" : "left";
      left = side === "right" ? r.right + box.gap : r.left - box.gap - box.cardW;
      top = Math.max(0, Math.min(window.innerHeight - box.cardH, r.bottom - box.boxH + box.cardTop));
    }
    overlayEl.dataset.side = side;
    Object.assign(ov.card.style, { left: Math.round(left) + "px", top: Math.round(top) + "px" });
    overlayEl.classList.add("placed");
    void ov.card.offsetWidth;                               // the wipe-in starts from the closed state
    overlayEl.classList.add("on");
    ovPlaced = true; maskSent = "";
  } finally { ovBusy = false; }
}
async function unplaceOverlay(atOnce) {
  ovBusy = true;
  try {
    overlayEl.classList.remove("on");
    if (atOnce) overlayEl.classList.remove("placed"); else { await ovSleep(260); overlayEl.classList.remove("placed"); }
    if (ovHost && !menu.isOpen) {                           // his menu owns the window now if it is open
      const a = API();
      let mine = false;
      try { mine = !!(a && a.companion_collapse && (await a.companion_collapse("overlay"))); } catch {}
      if (mine && !menu.isOpen) applyLayout(null);         // the host says the window was still the overlay's
    }
    ovHost = false; ovPlaced = false; maskSent = "";
  } finally { ovBusy = false; }
}
function drawOverlay() {
  const v = overlayModel.tick(performance.now());
  const allowed = overlayAllowed(), want = v.visible && allowed;
  if (want && !ovPlaced && !ovBusy) placeOverlay();
  else if (!want && ovPlaced && !ovBusy) unplaceOverlay(!allowed);
  if (!v.visible) return;                                   // on its way out: the last content stays during the wipe
  if (overlayEl.dataset.phase !== v.phase) overlayEl.dataset.phase = v.phase;
  const head = v.phase + "|" + v.label + "|" + v.busy;
  if (head !== ovDrawn) {
    ovDrawn = head; ov.label.textContent = v.label; ov.hint.textContent = OV_HINTS[v.phase] || "";
    overlayEl.classList.toggle("busy", v.busy);
  }
  if (v.chip !== ovChip) { ovChip = v.chip; if (v.chip) ov.chip.textContent = v.chip; ov.chip.classList.toggle("on", !!v.chip); }
  const lvl = Math.round(v.level * 50) / 50;
  if (lvl !== ovLevel) { ovLevel = lvl; ov.orb.style.setProperty("--lvl", String(lvl)); }
  if (v.seq !== ovSeq || v.words.length !== ovCount || v.text !== ovKind) {      // the text changed: rebuild its words
    const keep = v.seq === ovSeq && v.text === ovKind ? ovCount : 0;                // a reply that grew keeps its words
    if (!keep) ov.lines.textContent = "";
    for (let i = Math.max(0, keep); i < v.words.length; i++) {
      const s = document.createElement("span"); s.className = "w"; s.textContent = v.words[i] + " "; ov.lines.appendChild(s);
    }
    ovSeq = v.seq; ovCount = v.words.length; ovKind = v.text; ovShown = -1;
    ov.text.dataset.kind = v.words.length ? v.text : "none";
  }
  if (v.shown !== ovShown) {
    const spans = ov.lines.children;
    for (let i = 0; i < spans.length; i++) spans[i].classList.toggle("in", i < v.shown);
    ovShown = v.shown;
    const last = v.shown > 0 ? spans[Math.min(v.shown, spans.length) - 1] : null;   // two lines stay; older ones scroll up
    ov.lines.style.transform = "translateY(" + -(last ? Math.max(0, last.offsetTop - 24) : 0) + "px)";
  }
}
setInterval(drawOverlay, 33);

  _pickIdleAction(now) { return picker.choose(now); },
  // read-only hooks for the harness / Character Studio (turnaround renders, diagnostics)
  _adapter() { return activeAdapter; },
  _three() { return { scene, camera, renderer }; },
  _throw(vx, vy) { runThrow(Number(vx) || 0, Number(vy) || 0); return throwRunning; },   // harness: launch without a real flick
  _appReact(tx, ty, comedy) { runAppReact(Number(tx) || 0, Number(ty) || 0, { comedy: !!comedy }); return reacting; },
  _celebrate() { runCelebrate(); return reacting; },
  _drop(name) { runCatch([{ name: String(name || "file"), type: "", size: 0 }], null); return true; },   // harness: simulate a drop
  _wander() { runWander(); return wandering; },   // harness: trigger the walk-about
  _doze(on) { dozing = !!on; return dozing; },    // harness: toggle the sleep state
  accessory(kind) { try { activeAdapter && activeAdapter.setAccessory && activeAdapter.setAccessory(String(kind || "none")); } catch (e) {} return true; },   // Character Studio: live accessory swap
  retint(matsJson) {                                         // Character Studio: live recolour without a reload
    try {
      const mats = typeof matsJson === "string" ? JSON.parse(matsJson) : (matsJson || {});
      if (activeAdapter && activeAdapter.materials) retintActive(activeAdapter.materials, { materials: mats });
    } catch (e) { console.warn("[companion] retint failed:", e); }
    return true;
  },
  // poke / overlay hooks (diagnostics / tests): what a click and a double click do, and what the card shows
  _poke() { return poke(performance.now()); },
  _doublePoke() { return doublePoke(performance.now()); },
  _lastPoke() { return lastPoke; },
  _speech() { return { active: localSpeech.active, queued: localSpeech.queue.length, blocked: localSpeech.blocked(), trace: localSpeech.trace.slice(-12) }; },
  _overlay() { const r = ov.card.getBoundingClientRect();
    return { ...overlayModel.view(performance.now()), placed: ovPlaced, host: ovHost, side: overlayEl.dataset.side,
      rect: [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)] }; },
  // Living Presence hooks (diagnostics / tests)
  _interaction() { return { state: ix.state, base: ix.base, activity: userActivity, dock: dockLevel, menu: menu.isOpen ? menu.view : null }; },
  _menu(view) { if (view) menu.open(String(view)); else menu.close(); return menu.isOpen; },
  _relocate(x, y, style) { runRelocate({ x: Number(x) | 0, y: Number(y) | 0, style: String(style || "walk"), dock: 0 }); return true; },
  init(info) { this._initInfo = info || {}; },
  handle(msg) {
    if(msg?.type === "companion_action") {runRobotAction(msg.action);return;}
    if (msg?.type === "doing") { overlayModel.doing(String(msg.value || ""), performance.now()); return; }   // what a tool is busy with
    if (msg?.type === "level" && !overlayModel.local) overlayModel.level(msg.value, performance.now());          // mic while listening, his voice while speaking
    if (msg?.type === "line") overlayModel.line(msg.who, msg.text, performance.now());
    if (msg?.type === "state") {
      if (overlayModel.main === "speaking" && msg.value !== "speaking") noteRecent("spoke");
      overlayModel.state(String(msg.value), performance.now());
      localSpeech.setMainState(msg.value);
      if (localSpeech.blocked() && examining) { examining = false; if (reactPose?.phase === "examine") reactPose = null; }
    }
    if (msg?.type === "hide") {clickGate.cancel();localSpeech.clearQueue();localSpeech.cancel(false);flying=false;parkouring=false;wandering=false;perching=false;closeScene();}
    if (msg?.type === "surface") { habitat=msg.value || null; surfaceClip(); return; }
    if (msg && msg.type === "activity") { setActivity(String(msg.value || "other")); return; }               // what the user is doing
    if (msg && msg.type === "relocate") { runRelocate(msg).then(ok => { if(ok) {habitat=msg.habitat || null;if(habitat) lifeEvent("surface",null,habitat.surface_id);} }); return; }                                        // placement: go there
    if (msg && msg.type === "menu") {                                                                         // Ctrl+Alt+K / tests
      if (msg.action === "close") menu.close();
      else if (msg.action === "open" || !menu.isOpen) menu.open(msg.view || "main");
      else menu.close();
      return;
    }
    if (msg && msg.type === "game") { if(msg.phase==="start" && (roomOpen||directOpen||performanceOpen)) closeScene().then(()=>onGame(msg)); else onGame(msg); return; }                                                 // panel mini-game
    if (msg && msg.type === "throw") { runThrow(Number(msg.vx) || 0, Number(msg.vy) || 0); return; }   // launch (not buffered)
    if (msg && msg.type === "appreact") {                                                               // run over and kick a new app window
      const t = msg.target || [0, 0];
      runAppReact(Number(t[0]) || 0, Number(t[1]) || 0, { comedy: !!msg.comedy });
      return;
    }
    if (msg && msg.type === "celebrate") { runCelebrate(); return; }                                     // game win hop
    if (msg && msg.type === "drop") { runCatch([{ name: String(msg.name || "file"), type: "", size: 0 }], null); return; }   // catch a (simulated) dropped file
    if (msg && msg.type === "doze") { if (dozing && !msg.on) noteRecent("woke"); dozing = !!msg.on; return; }
    if (msg && msg.type === "proactive") {                  // harness: exercise the proactive greeting / break path
      if (msg.greet) speakBubble(timeGreeting(Number(msg.hour ?? new Date().getHours())), { proactive: true });
      if (msg.longsession) activeSince = Date.now() - (51 * 60 * 1000);   // pretend ~51 min of continuous activity
      return;
    }
    if (msg && msg.type === "mood") {                       // Jarvis/tests: nudge a mood (e.g. after good/bad news)
      if (MOODS.includes(msg.value) && msg.value !== "neutral") mood.nudge(msg.value, Number(msg.amount ?? 0.6));
      return;
    }
    if (msg && msg.type === "idle" && msg.value) {           // force a specific idle behaviour (Jarvis/tests)
      currentIdle = msg.value; idleStart = performance.now();
      if (msg.value === "wander") runWander();
      else if (msg.value === "perch") runPerch();
      else if (msg.value === "curious") runCurious();
      else if (msg.value === "fly") runFly();
      else if (msg.value === "parkour") runParkour();
      else if (msg.value === "play") runPlay();
      return;
    }
    if (!incoming.put(msg)) return;
    if (msg && msg.type === "line" && msg.who === "jarvis" && typeof msg.text === "string") {
      showBubble(msg.text);
      visemeTimeline = textToVisemes(msg.text); visemeStart = performance.now();   // drive the mouth shapes from the words
    }
    if (msg && msg.type === "hide") {                         // hidden (a full-screen game...): nothing may take clicks
      if (gesture.active) endPress(gesture.cancel());
      if (menu.isOpen) menu.close();
      document.body.style.visibility = "hidden"; scheduler.suspend(); ix.set("suspended");
      maskSpec = null; maskPrev = null; panelHit = false; sendHitMask(performance.now());
    }
    else if (msg && msg.type === "show") {
      document.body.style.visibility = "visible"; scheduler.resume();
      if (ix.is("suspended")) {if(roomOpen) ix.set("playing");else ix.rest();}
    }
  },
};
window._run2DFallback_marker = "run2DFallback";

// ---------------- Boot ---------------- //
let bootCount = 0;
async function boot() {
  bootCount += 1;
  initFallback();
  const api = window.pywebview && window.pywebview.api;
  if (api && api.load_companion_settings) {
    try {
      const s = await api.load_companion_settings();
      const safe = safeSettings(s);
      companion.settings = safe;
      companion.reducedMotion = safe.reduced_motion || matchMedia("(prefers-reduced-motion: reduce)").matches;
      picker.reducedMotion = companion.reducedMotion;
    } catch {}
  } else {
    companion.reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    picker.reducedMotion = companion.reducedMotion;
  }
  profile = await loadActiveProfile();

  const ok = await tryLoadThreeAndRender();
  if (!ok) hadWebGL = false;

  // Seasonal theme: if enabled and the profile isn't wearing something explicit, wear the season's accessory
  // and greet by the calendar (Feature #27 — seasonal themes).
  let greeted = false;
  if (ok && activeAdapter && activeAdapter.setAccessory && companion.settings.seasonal !== false
      && (!profile.accessory || profile.accessory === "none")) {
    const theme = seasonalTheme(new Date().getMonth());
    if (theme.accessory !== "none") {
      activeAdapter.setAccessory(theme.accessory);
      if (theme.greeting) { setTimeout(() => speakBubble(theme.greeting, { proactive: true }), 2200); greeted = true; }
    }
  }

  // Proactive assistance (Feature #—, proactive task assistance): a time-of-day greeting at launch,
  // then a gentle break reminder after a long continuous active stretch. Both gated by the `proactive`
  // setting; the greeting defers to a seasonal one so they never clobber each other's bubble.
  if (companion.settings.proactive !== false && !greeted) {
    mood.nudge("happy", 0.3);                                   // a cheerful hello to start the session
    setTimeout(() => speakBubble(timeGreeting(new Date().getHours()), { proactive: true }), 2600);
  }

  await loadHome();
  await lifeEvent();
  initVoiceBridge();
  scheduler.start();

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {localSpeech.cancel(false);closeScene();scheduler.suspend();}
    else scheduler.resume();
  });

  // Diagnostics push (snapshot every ~1 s). Includes adapter capabilities
  // and the bone contract so Codex / tests can see what the renderer has.
  let _fpsFrames = renderCount, _fpsAt = performance.now();
  setInterval(() => {
    const api2 = window.pywebview && window.pywebview.api;
    if (!api2 || !api2.push_renderer_snapshot) return;
    const _nowF = performance.now(), _dt = (_nowF - _fpsAt) / 1000;   // measured RENDER rate (past the fps gate) over ~1 s
    const fps = _dt > 0 ? Number(((renderCount - _fpsFrames) / _dt).toFixed(1)) : 0;
    _fpsFrames = renderCount; _fpsAt = _nowF;
    const snap = {
      schema: SCHEMA,
      mode: companion.mode,
      jaw: Number(companion.jaw.toFixed(3)),
      level: Number(companion.level.toFixed(3)),
      last_level_at: companion.lastLevelAt | 0,
      frames: scheduler.frames,
      fps: fps,
      running: scheduler.running,
      suspended: scheduler.suspended,
      had_webgl: hadWebGL,
      boots: bootCount,
      skinned_meshes: (() => { let n = 0; scene?.traverse((o) => { if (o.isSkinnedMesh) n += 1; }); return n; })(),   // one per material primitive (all share ONE skeleton); double-boot is caught by boots===1
      size: [window.innerWidth, window.innerHeight],
      character_px: companion.settings.character_px,
      character_px_measured: measureCharacterPx(),
      jaw_visible: !!(activeAdapter && activeAdapter.bones && activeAdapter.bones.mouthOpen && activeAdapter.bones.mouthOpen.visible),
      transparent_native: !!(window.companion && window.companion._initInfo && window.companion._initInfo.transparent),
      profile_id: profile ? profile.id : null,
      adapter_id: profile ? profile.adapter_id : null,
      model_id: profile ? profile.model_id : null,
      capabilities: activeAdapter ? activeAdapter.capabilities : null,
      material_slots: activeAdapter && activeAdapter.materials ? Object.keys(activeAdapter.materials) : [],
      quip_meter: !!meter,
      held: held,
      throwing: throwRunning,
      reacting: reacting,
      react_phase: reactPose ? reactPose.phase : null,
      react_kind: reactPose ? (reactPose.kind || null) : null,
      last_drop: lastDrop,
      viseme: curViseme,
      playing: playing,
      flying: flying,
      reduced_motion: companion.reducedMotion,
      habitat: habitat,
      surface_contact: measuredSurfaceContact(),
      home: {open:roomOpen,state:homeState},
      direct_play: directPlay?.snapshot() || null,
      performance: performances?.snapshot() || null,
      speech_trace: localSpeech.trace.slice(-20),
      performance_budget: performanceBudget.snapshot(),
      life: lifeInfo ? {traits:lifeInfo.traits,counts:lifeInfo.snapshot?.counts} : null,
      idle_action: currentIdle,
      // Living Presence: the interaction state machine, what the user is doing, his menu (with clickable
      // control positions in screen px, so a test can press a real button by name), docking, reactions.
      interaction: ix.state, interaction_base: ix.base, transition: lastTransition, activity: userActivity,
      hovered: hover.hovered, look: lookTarget ? { x: Number(lookTarget.x.toFixed(2)), y: Number(lookTarget.y.toFixed(2)) } : null,
      menu: menu.isOpen ? { view: menu.view, side: menu.layout ? menu.layout.side : null, busy: menu.busy, controls: menu.rects() } : null,
      dock: dockLevel, landing: lastLanding, drop_kind: lastDropKind, game: gameNow,
      hitmask: { cells: maskCells, suppressed: maskSuppressed() }, gpu: gpuInfo,
      window_rect: [window.screenX, window.screenY, window.innerWidth, window.innerHeight],
      bubble: bubbleEl.classList.contains("on") ? bubbleEl.textContent : null,
      mood: (() => { const d = mood.dominant(performance.now()); return { name: d.mood, intensity: Number(d.intensity.toFixed(3)) }; })(),
      throw_state: throwVisual ? { x: Math.round(throwVisual.x), y: Math.round(throwVisual.y),
        vx: Math.round(throwVisual.vx), vy: Math.round(throwVisual.vy),
        resting: !!throwVisual.resting, bounces: throwVisual.bounces | 0 } : null,
      ts: Date.now(),
    };
    try { api2.push_renderer_snapshot(JSON.stringify(snap)); } catch {}
  }, 1000);

  // Keep the host's position lease alive while an interaction lasts (it lapses on its own if this page dies).
  setInterval(() => ix.renew(), 1000);

  // Curiosity, and a file being dragged toward him. The cursor over his transparent surroundings never reaches the
  // page (those pixels are click-through), so the host reports where it is a few times a second — only while he's
  // visible and nobody's interacting with him. Bounded: one cheap call per 200 ms.
  setInterval(async () => {
    const a = API();
    if (!a || !a.pointer_state || scheduler.suspended || document.hidden || menu.isOpen) return;
    if (!ix.is("ambient", "work_focus", "curious", "docked", "drop_target")) return;
    let s = null; try { s = await a.pointer_state(); } catch { return; }
    if (!s) return;
    const { w, h } = stageSize();
    const cx = window.screenX + w / 2, cy = window.screenY + h * 0.35, dx = s.x - cx, dy = s.y - cy, d = Math.hypot(dx, dy);
    if (s.dragging_file && d < GESTURE.CURIOUS_RADIUS) {          // someone is bringing him something: get ready
      if (!ix.is("drop_target")) { ix.set("drop_target"); mood.nudge("curious", 0.3); }
      reactPose = reacting ? reactPose : { phase: "brace" }; braceUntil = performance.now() + 400;
      lookTarget = { x: Math.max(-1, Math.min(1, dx / 300)), y: Math.max(-1, Math.min(1, dy / 300)) };
      return;
    }
    if (ix.is("drop_target") && !reacting) { ix.rest(); return; }
    if (d < GESTURE.CURIOUS_RADIUS && !dozing) {
      if (!ix.is("curious")) { ix.set("curious"); mood.nudge("curious", 0.15); }
      if (wandering || perching) { wandering = false; perching = false; }   // stop a stroll: he waits to be reached
      lookTarget = { x: Math.max(-1, Math.min(1, dx / 300)), y: Math.max(-1, Math.min(1, dy / 300)) };
    } else if (ix.is("curious") && d > GESTURE.CURIOUS_RADIUS * 1.25) {
      ix.rest(); lookTarget = null;
    }
  }, 200);

  // Doze off when the user has been away a while; wake the moment they return.
  setInterval(async () => {
    const a = window.pywebview && window.pywebview.api;
    if (!a || !a.idle_seconds || throwRunning || held || reacting || wandering || ix.owning) return;
    let s = 0; try { s = await a.idle_seconds(); } catch { return; }
    if (!dozing && !flying && !parkouring && !held && s > 30) { dozing = true; dozeSince = Date.now(); mood.nudge("tired", 0.6); }
    else if (dozing && s < 2) {                                 // they're back: he looks up and stretches
      dozing = false; mood.nudge("happy", 0.3);
      currentIdle = "stretch"; idleStart = performance.now();
      // a spoken-style hello only after a real absence, and not every time (no greeting spam)
      if (Date.now() - dozeSince > 3 * 60000 && Date.now() - lastWelcome > 20 * 60000) { speakBubble("Oh — welcome back, sir.", { proactive: true }); lastWelcome = Date.now(); }
    }

    // Proactive break reminder: track one continuous active stretch; after ~50 min, suggest a break once.
    // Going idle (>60 s away) resets the stretch so the next suggestion is fresh.
    if (companion.settings.proactive !== false) {
      if (s < 2) {
        if (!activeSince) activeSince = Date.now();
        if (!dozing && shouldSuggestBreak(Date.now() - activeSince, breakSuggested)) {
          breakSuggested = true;
          mood.nudge("tired", 0.5);
          speakBubble("You've been at it nearly an hour, sir. A short break, perhaps?", { proactive: true });
          currentIdle = "stretch"; idleStart = performance.now();   // a little stretch to go with it
        }
      } else if (s > 60) { activeSince = 0; breakSuggested = false; }
    }
  }, 3000);
}

// Boot EXACTLY once. Both triggers used to fire in the real window (pywebview injects itself after DOMContentLoaded),
// which built two renderers + two render loops on one canvas: two robots drawn on top of each other, ~240 fps.
let booted = false;
const bootOnce = () => { if (booted) return; booted = true; boot(); };
window.addEventListener("pywebviewready", bootOnce);
window.addEventListener("DOMContentLoaded", () => {
  if (window.pywebview && window.pywebview.api) bootOnce();
  else setTimeout(bootOnce, 1500);               // plain browser (lab / tests): no pywebview is coming
});
</script>
