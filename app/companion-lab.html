<!doctype html>
<meta charset="utf-8">
<title>Companion rig lab</title>
<!--
  Developer page (served by the harness / app server): loads a GLB + rig through the REAL glb-model-v1 adapter and
  lets you pose it, so skinning, joint pivots and the face overlays can be checked in a browser before they ship.
    /companion-lab.html?model=/companion/models/robot/robot-lod0.glb&rig=/companion/rigs/robot-rig.json&bg=808890
  Console API: lab.ready, lab.pose(clipName, ms), lab.set({boneName:[rx,ry,rz]}), lab.face({jaw, mode, ms}), lab.shot()
-->
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.min.js",
  "three/addons/environments/RoomEnvironment.js": "/vendor/three/addons/environments/RoomEnvironment.js",
  "three/addons/": "/vendor/three/addons/" } }</script>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
import * as T from "three";
import { buildAdapterAsync } from "/companion/profiles.js";
import { CLIPS, resetBones } from "/companion/animation.js";

const q = new URLSearchParams(location.search);
const W = +(q.get("w") || 540), H = +(q.get("h") || 600);
const profile = { id: "lab", adapter_id: "glb-model-v1", model_url: q.get("model") || "/companion/models/robot/robot-lod0.glb",
  rig_url: q.get("rig") || null, materials: {}, proportions: {} };
const canvas = document.getElementById("c"); canvas.width = W; canvas.height = H;
const renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = +(q.get("exp") || 1.15);
renderer.outputColorSpace = T.SRGBColorSpace; renderer.setClearColor(parseInt(q.get("bg") || "808890", 16), 1);
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(32, W / H, 0.05, 20);
const roomMod = await import("three/addons/environments/RoomEnvironment.js");
scene.environment = new T.PMREMGenerator(renderer).fromScene(new roomMod.RoomEnvironment(renderer), 0.04).texture;
const key = new T.DirectionalLight(0xffffff, 1.1); key.position.set(2, 3, 4);
const rim = new T.DirectionalLight(0x7eccff, 0.55); rim.position.set(-3, 1, -2);
const fill = new T.DirectionalLight(0xffe4b8, 0.25); fill.position.set(0, -1, 3);
scene.add(key, rim, fill, new T.AmbientLight(0xdce7f2, 0.35));

const adapter = await buildAdapterAsync(T, profile);
scene.add(adapter.group);
function fit(yaw = 0) {
  const box = new T.Box3().setFromObject(adapter.group), size = box.getSize(new T.Vector3()), c = box.getCenter(new T.Vector3());
  const d = Math.max((size.y / 2) / Math.tan(camera.fov * Math.PI / 360), (size.x / 2 / camera.aspect) / Math.tan(camera.fov * Math.PI / 360)) * 1.22;
  camera.position.set(c.x + Math.sin(yaw) * d, c.y, c.z + Math.cos(yaw) * d); camera.lookAt(c); camera.updateProjectionMatrix();
}
let yaw = 0; fit(yaw);
const draw = () => { adapter.sync?.(); renderer.render(scene, camera); };
const lab = window.lab = {
  adapter, T, scene, camera, renderer,
  ready: true, capabilities: adapter.capabilities, fallback: adapter.fallback_reason || null,
  view(y) { yaw = y * Math.PI / 180; fit(yaw); draw(); },
  pose(name, ms = 1000) { resetBones(adapter.bones); CLIPS.idle.apply(adapter.bones, 0, 0); const c = CLIPS[name]; if (c && name !== "idle") c.apply(adapter.bones, 0.5, ms); adapter.updateAnimation?.(name, ms); draw(); return !!c; },
  set(map) { resetBones(adapter.bones); for (const [n, r] of Object.entries(map)) { const b = adapter.bones[n]; if (b) b.rotation.set(r[0], r[1], r[2]); } draw(); },
  face({ jaw = 0, mode = "idle", ms = 0 } = {}) { for (let i = 0; i < 12; i++) adapter.face?.update(jaw, mode, 1000 + i * 16); draw(); },
  draw,
  shot() { draw(); return canvas.toDataURL("image/png"); },
};
draw();
</script>
