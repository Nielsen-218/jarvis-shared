<script>
// The photo fitting room and the old avatar pages are retired: the 3D dressing room (wardrobe.html) replaces them.
// Carry a pairing token (#t=) straight through; otherwise open the dressing room's Avatar tab.
var h = location.hash && location.hash.indexOf("#t=") === 0 ? location.hash : "#avatar";
try { location.replace("/wardrobe.html" + h); } catch (e) { location.href = "/wardrobe.html" + h; }
</script>
