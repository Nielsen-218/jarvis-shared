<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis Kitchen</title>
<meta name="theme-color" content="#06080C">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/design-system.css">
<link rel="stylesheet" href="/kitchen.css">
<script>
  /* Theme before first paint: dark first; the light override is opt-in (You tab, or ?theme=light). */
  (function () { var t = null; try { t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("jarvis_kitchen_theme"); } catch (e) {}
    if (t === "light") document.documentElement.setAttribute("data-theme", "light"); })();
</script>
<style>
  /* Everything else lives in kitchen.css; this keeps the first paint from flashing unstyled. */
  [hidden] { display: none !important; }
</style>
</head>
<body class="ds">
<header class="k-top ds-glass">
  <a class="ds-iconbtn ghost" href="/" aria-label="Back to Jarvis"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
  <h1>Kitchen</h1>
  <span class="k-top-meta" id="topMeta" aria-live="polite"></span>
</header>

<main id="main">
  <section id="today" role="tabpanel" aria-labelledby="tab-today" tabindex="-1">
    <div class="k-skel-hero"><div class="ds-skeleton" style="height:14px;width:40%"></div><div class="ds-skeleton" style="height:36px;width:70%"></div>
      <div class="ds-skeleton" style="height:180px;border-radius:var(--r-4)"></div><div class="ds-skeleton k-skel-photo"></div><div class="ds-skeleton k-skel-photo"></div></div>
  </section>
  <section id="snap" role="tabpanel" aria-labelledby="tab-snap" tabindex="-1" hidden></section>
  <section id="week" role="tabpanel" aria-labelledby="tab-week" tabindex="-1" hidden></section>
  <section id="pantry" role="tabpanel" aria-labelledby="tab-pantry" tabindex="-1" hidden></section>
  <section id="you" role="tabpanel" aria-labelledby="tab-you" tabindex="-1" hidden></section>
</main>

<nav class="k-dock ds-glass" role="tablist" aria-label="Kitchen sections">
  <button class="k-tab" id="tab-today" role="tab" aria-selected="true" aria-controls="today" data-tab="today">
    <svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg><span>Today</span></button>
  <button class="k-tab" id="tab-snap" role="tab" aria-selected="false" aria-controls="snap" data-tab="snap" tabindex="-1">
    <svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg><span>Snap</span></button>
  <button class="k-tab" id="tab-week" role="tab" aria-selected="false" aria-controls="week" data-tab="week" tabindex="-1">
    <svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Week</span></button>
  <button class="k-tab" id="tab-pantry" role="tab" aria-selected="false" aria-controls="pantry" data-tab="pantry" tabindex="-1">
    <svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6Z"/><path d="M5 10h14"/><path d="M15 7v6"/></svg><span>Pantry</span></button>
  <button class="k-tab" id="tab-you" role="tab" aria-selected="false" aria-controls="you" data-tab="you" tabindex="-1">
    <svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg><span>You</span></button>
</nav>

<div id="sheetRoot"></div>
<div class="ds-toast k-toast" id="toast" hidden role="status" aria-live="polite"></div>
<script src="/kitchen.js"></script>
</body>
</html>
